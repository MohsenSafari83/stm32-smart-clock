  <text x="765" y="166" text-anchor="middle" class="n-s">CH1(R) CH2(G) CH3(B)</text>
  <line x1="825" y1="153" x2="865" y2="153" stroke="#22c55e" stroke-width="2.25" marker-end="url(#arr)"/>

  <rect x="870" y="132" width="180" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.75"/>
