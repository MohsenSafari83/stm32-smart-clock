<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/></marker>
  </defs>

  <rect width="1100" height="920" fill="#0f172a" rx="8"/>
  <rect x="10" y="10" width="1080" height="900" fill="none" stroke="#334155" stroke-width="2" rx="6"/>

  <text x="550" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">Hardware Signal Data Flow — 6 End-to-End Chains</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#64748b">::FW_SIGNAL_PATHS — sensor → peripheral → HAL → software → actuator</text>

  <!-- FLOW 1: NTC → ADC → RGB -->
  <rect x="30" y="78" width="1040" height="105" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="50" y="103" font-size="14" font-weight="bold" fill="#fbbf24"> ① NTC → ADC → RGB  (Temperature-to-Color Mapping)</text>

  <rect x="60" y="120" width="110" height="42" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="115" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">NTC</text>
  <text x="115" y="154" text-anchor="middle" font-size="10" fill="#94a3b8">10kΩ B=3950</text>
  <line x1="170" y1="141" x2="210" y2="141" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="215" y="120" width="115" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="272" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">PA0 ADC1_IN0</text>
  <text x="272" y="154" text-anchor="middle" font-size="10" fill="#94a3b8">Analog 12-bit</text>
  <line x1="330" y1="141" x2="370" y2="141" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="375" y="120" width="120" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="435" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">ADC1 + HAL</text>
  <text x="435" y="154" text-anchor="middle" font-size="10" fill="#94a3b8">Start/Poll/GetValue</text>
  <line x1="495" y1="141" x2="535" y2="141" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="540" y="120" width="120" height="42" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Beta Equation</text>
  <text x="600" y="154" text-anchor="middle" font-size="10" fill="#94a3b8">T=1/(A+B·lnR+C·ln³R)−273</text>
  <line x1="660" y1="141" x2="700" y2="141" stroke="#ec4899" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="705" y="120" width="120" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="765" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">TIM1 PWM</text>
  <text x="765" y="154" text-anchor="middle" font-size="10" fill="#94a3b8">CH1(R) CH2(G) CH3(B)</text>
  <line x1="825" y1="141" x2="865" y2="141" stroke="#22c55e" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="870" y="120" width="180" height="42" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="960" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">RGB LED</text>
  <text x="960" y="154" text-anchor="middle" font-size="10" fill="#94a3b8">Common cathode · PA8/9/10</text>

  <!-- FLOW 2: TM1637 -->
  <rect x="30" y="198" width="1040" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="50" y="223" font-size="14" font-weight="bold" fill="#c084fc"> ② TM1637 Display Chain</text>

  <rect x="60" y="240" width="130" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="125" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Refresh_Display</text>
  <line x1="190" y1="258" x2="225" y2="258" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="230" y="240" width="100" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="280" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">PC6 DIO</text>
  <line x1="330" y1="258" x2="365" y2="258" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="370" y="240" width="100" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="420" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">PC7 CLK</text>
  <line x1="470" y1="258" x2="505" y2="258" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="510" y="240" width="120" height="36" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
  <text x="570" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">write_byte</text>
  <line x1="630" y1="258" x2="665" y2="258" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="670" y="240" width="110" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="725" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Seg Buffer[4]</text>
  <line x1="780" y1="258" x2="815" y2="258" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="820" y="240" width="230" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="935" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">TM1637 Module</text>
  <text x="935" y="271" text-anchor="middle" font-size="10" fill="#64748b">Bit-bang @20µs · OD GPIO</text>

  <!-- FLOW 3: Button → FSM -->
  <rect x="30" y="303" width="1040" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="50" y="328" font-size="14" font-weight="bold" fill="#f87171"> ③ Button Input → FSM Chain</text>

  <rect x="60" y="345" width="120" height="36" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">PB13/14/15</text>
  <line x1="180" y1="363" x2="215" y2="363" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="220" y="345" width="110" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="275" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">GPIOB read</text>
  <line x1="330" y1="363" x2="365" y2="363" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="370" y="345" width="120" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="430" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Debounce 250ms</text>
  <line x1="490" y1="363" x2="525" y2="363" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="530" y="345" width="170" height="36" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
  <text x="615" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Execute_Button_Action</text>
  <line x1="700" y1="363" x2="735" y2="363" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="740" y="345" width="130" height="36" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="805" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">FSM → state</text>

  <!-- FLOW 4: UART -->
  <rect x="30" y="408" width="1040" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="433" font-size="14" font-weight="bold" fill="#60a5fa"> ④ UART Data Output Chain</text>

  <rect x="60" y="450" width="140" height="36" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Temp + Time Data</text>
  <line x1="200" y1="468" x2="235" y2="468" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="240" y="450" width="100" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="290" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">PA2 TX</text>
  <line x1="340" y1="468" x2="375" y2="468" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="380" y="450" width="120" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">USART2</text>
  <line x1="500" y1="468" x2="535" y2="468" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="540" y="450" width="130" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="605" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">HAL_UART_Tx</text>
  <line x1="670" y1="468" x2="705" y2="468" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="710" y="450" width="130" height="36" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="775" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">LED1 PB3</text>

  <text x="550" y="490" text-anchor="middle" font-size="11" fill="#64748b">9600 baud 8N1 · blocking TX · ~4ms per message · interval configurable 1-99s (default 5s)</text>

  <!-- FLOW 5: EEPROM -->
  <rect x="30" y="513" width="1040" height="90" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="50" y="538" font-size="14" font-weight="bold" fill="#4ade80"> ⑤ EEPROM Settings Storage (I²C)</text>

  <rect x="60" y="555" width="130" height="36" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Settings Struct</text>
  <line x1="190" y1="573" x2="225" y2="573" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="230" y="555" width="140" height="36" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Load/Save EEPROM</text>
  <line x1="370" y1="573" x2="405" y2="573" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="410" y="555" width="130" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="475" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">HAL_I2C_R/W</text>
  <line x1="540" y1="573" x2="575" y2="573" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="580" y="555" width="120" height="36" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">I2C2 PA11/12</text>
  <line x1="700" y1="573" x2="735" y2="573" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="740" y="555" width="140" height="36" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="810" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">24Cxx @ 0xA0</text>

  <!-- FLOW 6: RTC -->
  <rect x="30" y="618" width="1040" height="90" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="50" y="643" font-size="14" font-weight="bold" fill="#22d3ee"> ⑥ RTC Timekeeping Chain</text>

  <rect x="60" y="660" width="110" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="115" y="683" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">LSE 32.768kHz</text>
  <line x1="170" y1="678" x2="205" y2="678" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="210" y="660" width="110" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="265" y="683" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">RTC Registers</text>
  <line x1="320" y1="678" x2="355" y2="678" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="360" y="660" width="130" height="36" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="425" y="683" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">HAL_RTC_GetTime</text>
  <line x1="490" y1="678" x2="525" y2="678" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="530" y="660" width="150" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="605" y="683" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Display + UART</text>

  <text x="550" y="700" text-anchor="middle" font-size="11" fill="#f87171">KNOWN BUG: MX_RTC_Init unconditionally sets time to 00:36:00 on every boot · async=127 sync=255 → ~1Hz · polled, no IRQ</text>

  <!-- BOTTOM: CROSS-REFERENCE TABLE -->
  <rect x="30" y="728" width="1040" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="756" text-anchor="middle" font-size="15" font-weight="bold" fill="#e5e7eb">Hardware ↔ Firmware Cross-Reference (::FW_CROSS_LINKS)</text>

  <g font-size="11">
    <text x="50" y="785" font-weight="bold" fill="#e5e7eb">Signal Path</text>
    <text x="200" y="785" font-weight="bold" fill="#e5e7eb">Hardware Pins</text>
    <text x="450" y="785" font-weight="bold" fill="#e5e7eb">Firmware Modules</text>
    <text x="700" y="785" font-weight="bold" fill="#e5e7eb">Key Functions</text>

    <text x="50" y="812" fill="#fbbf24">ADC/NTC/RGB</text>
    <text x="200" y="812" fill="#94a3b8">PA0, ADC1, TIM1, PA8-10, RGB LED</text>
    <text x="450" y="812" fill="#94a3b8">hal_adc, ntc, temp_sense, hal_tim</text>
    <text x="700" y="812" fill="#94a3b8">Update_Temperature_LED()</text>

    <text x="50" y="836" fill="#c084fc">TM1637 Display</text>
    <text x="200" y="836" fill="#94a3b8">PC6, PC7, TM1637 module</text>
    <text x="450" y="836" fill="#94a3b8">tm1637, display_mgr, hal_gpio</text>
    <text x="700" y="836" fill="#94a3b8">tm1637_write_string()</text>

    <text x="50" y="860" fill="#f87171">Button / FSM</text>
    <text x="200" y="860" fill="#94a3b8">PB13-15, GPIOB</text>
    <text x="450" y="860" fill="#94a3b8">fsm, hal_gpio</text>
    <text x="700" y="860" fill="#94a3b8">Execute_Button_Action()</text>
  </g>
</svg>
