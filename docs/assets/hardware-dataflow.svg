    .warn    { font: 10.5px 'JetBrains Mono',monospace; fill:#f87171; }
    .th      { font: 700 11px 'JetBrains Mono',monospace; fill:#e5e7eb; }
    .td      { font: 10.5px 'JetBrains Mono',monospace; fill:#94a3b8; }
  </style>

  <rect width="1100" height="920" fill="#0f172a" rx="10"/>
