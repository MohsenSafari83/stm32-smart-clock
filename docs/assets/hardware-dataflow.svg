  <line x1="780" y1="270" x2="815" y2="270" stroke="#a855f7" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="820" y="252" width="230" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.75"/>
