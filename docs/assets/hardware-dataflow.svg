  <!-- Header -->
  <text x="40" y="42" class="kicker">ENGINEERING DIAGRAM · 04 / 06</text>
  <text x="550" y="48" text-anchor="middle" class="title">Hardware Signal Data Flow — 6 End-to-End Chains</text>
  <text x="550" y="67" text-anchor="middle" class="subtitle">::FW_SIGNAL_PATHS — sensor → peripheral → HAL → software → actuator</text>
  <use href="#i-flow" x="1030" y="30" width="14" height="14" color="#475569"/>
  <text x="1060" y="42" text-anchor="end" class="corner">STM32G030 · Smart Clock Sim</text>
  <line x1="40" y1="80" x2="1060" y2="80" stroke="#1c2740" stroke-width="1"/>

  <!-- FLOW 1: NTC → ADC → RGB -->
  <rect x="30" y="90" width="1040" height="105" rx="8" fill="#181f10" stroke="#f59e0b" stroke-width="1.75"/>
  <text x="50" y="115" class="flow-h" fill="#fbbf24">① NTC → ADC → RGB — Temperature-to-Color Mapping</text>

  <rect x="60" y="132" width="110" height="42" rx="6" class="n-t" fill="#0f172a" stroke="#f59e0b" stroke-width="1.75"/>
  <use href="#i-therm" x="68" y="139" width="12" height="12" color="#fbbf24"/>
  <text x="120" y="150" text-anchor="middle" class="n-t">NTC</text>
  <text x="115" y="166" text-anchor="middle" class="n-s">10 kΩ · β=3950</text>
  <line x1="170" y1="153" x2="210" y2="153" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#arr)"/>

  <rect x="215" y="132" width="115" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.75"/>
  <use href="#i-adc" x="223" y="139" width="12" height="12" color="#93c5fd"/>
  <text x="277" y="150" text-anchor="middle" class="n-t">PA0 ADC1_IN0</text>
  <text x="272" y="166" text-anchor="middle" class="n-s">Analog · 12-bit</text>
  <line x1="330" y1="153" x2="370" y2="153" stroke="#3b82f6" stroke-width="2.25" marker-end="url(#arr)"/>

  <rect x="375" y="132" width="120" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.75"/>
  <use href="#i-adc" x="383" y="139" width="12" height="12" color="#93c5fd"/>
  <text x="440" y="150" text-anchor="middle" class="n-t">ADC1 + HAL</text>
  <text x="435" y="166" text-anchor="middle" class="n-s">Start / Poll / GetValue</text>
  <line x1="495" y1="153" x2="535" y2="153" stroke="#3b82f6" stroke-width="2.25" marker-end="url(#arr)"/>

  <rect x="540" y="132" width="120" height="42" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.75"/>
  <use href="#i-flow" x="548" y="139" width="12" height="12" color="#f472b6"/>
  <text x="605" y="150" text-anchor="middle" class="n-t">Beta Equation</text>
  <text x="600" y="166" text-anchor="middle" class="n-s" font-size="8.8">T = 1/(A+B·lnR+C·ln³R) − 273</text>
  <line x1="660" y1="153" x2="700" y2="153" stroke="#ec4899" stroke-width="2.25" marker-end="url(#arr)"/>

