<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <marker id="arr-fwd"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="arr-save" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="arr-sub"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f59e0b"/></marker>
    <pattern id="fsm-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#1b2438"/></pattern>
    <linearGradient id="ga-norm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16241c"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="ga-menu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221d16"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="ga-set"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <symbol id="i-flow"   viewBox="0 0 16 16"><path d="M1 8 L11 8"/><path d="M8 5 L11 8 L8 11"/></symbol>
    <symbol id="i-chip"   viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/><line x1="1" y1="6" x2="4" y2="6"/><line x1="1" y1="10" x2="4" y2="10"/><line x1="12" y1="6" x2="15" y2="6"/><line x1="12" y1="10" x2="15" y2="10"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="6" y1="12" x2="6" y2="15"/><line x1="10" y1="12" x2="10" y2="15"/></symbol>
    <symbol id="i-clock"  viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="8" x2="8" y2="4"/><line x1="8" y1="8" x2="11" y2="9.5"/></symbol>
    <symbol id="i-display" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="8" y1="8" x2="8" y2="12"/></symbol>
    <symbol id="i-eeprom" viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="8" rx="1"/><line x1="5" y1="6" x2="11" y2="6"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="5" y1="10" x2="11" y2="10"/></symbol>
    <symbol id="i-uart"   viewBox="0 0 16 16"><path d="M2 13 Q8 2 14 13"/><path d="M5 13 Q8 8 11 13"/><circle cx="8" cy="13" r="1" fill="currentColor" stroke="none"/></symbol>
  </defs>

  <style>
    .kicker  { font: 700 9.5px 'JetBrains Mono',monospace; letter-spacing:1.4px; fill:#22d3ee; }
    .title   { font: 700 19px 'JetBrains Mono',monospace; fill:#f8fafc; }
    .subtitle{ font: 11px 'JetBrains Mono',monospace; fill:#64748b; }
    .corner  { font: 9.5px 'JetBrains Mono',monospace; fill:#475569; }
    .sec-t   { font: 700 13.5px 'JetBrains Mono',monospace; }
    .sec-s   { font: 9.5px 'JetBrains Mono',monospace; fill:#5b6b80; }
    .card    { fill:#141d31; stroke:#263349; stroke-width:1.25; }
    .n-title { font: 700 12.5px 'JetBrains Mono',monospace; fill:#f1f5f9; }
    .n-sub   { font: 10px 'JetBrains Mono',monospace; fill:#8b98ac; }
    .n-micro { font: 9px 'JetBrains Mono',monospace; fill:#5b6b80; }
    .foot    { font: 9px 'JetBrains Mono',monospace; fill:#3a475c; letter-spacing:.4px; }
    .badge   { fill:#0b111e; }
    .state   { fill:#0b1420; }
    .tlbl    { font: 700 10px 'JetBrains Mono',monospace; }
  </style>

  <rect width="1100" height="920" fill="#0f172a" rx="10"/>
  <rect width="1100" height="920" fill="url(#fsm-grid)" rx="10"/>
  <rect x="10" y="10" width="1080" height="900" fill="none" stroke="#334155" stroke-width="1.5" rx="8"/>
  <rect x="26" y="20" width="1048" height="3" rx="1.5" fill="#22d3ee" opacity="0.85"/>

  <!-- Header -->
  <text x="40" y="42" class="kicker">ENGINEERING DIAGRAM · 03 / 06</text>
  <text x="550" y="48" text-anchor="middle" class="title">Finite State Machine</text>
  <text x="550" y="67" text-anchor="middle" class="subtitle">::FSM_STATES · ::FSM_TRANSITIONS — 8 states, 12 transitions · 3 buttons: SW1(UP)=PB13, SW2(DOWN)=PB14, SW3(SEL)=PB15</text>
  <use href="#i-chip" x="1030" y="30" width="14" height="14" color="#475569"/>
  <text x="1060" y="42" text-anchor="end" class="corner">STM32G030 · Smart Clock Sim</text>
  <line x1="40" y1="80" x2="1060" y2="80" stroke="#1c2740" stroke-width="1"/>

  <!-- NORMAL -->
  <rect x="400" y="100" width="300" height="64" rx="10" class="state" stroke="#22c55e" stroke-width="2"/>
  <rect x="400" y="100" width="3" height="64" rx="1.5" fill="#22c55e"/>
  <circle cx="422" cy="120" r="10" class="badge" stroke="#22c55e" stroke-width="1.2"/>
  <use href="#i-clock" x="416" y="114" width="11" height="11" color="#22c55e"/>
  <text x="555" y="125" text-anchor="middle" class="n-title" fill="#86efac">NORMAL (clock)</text>
  <text x="550" y="148" text-anchor="middle" class="n-sub">Display HH:MM · PWM LED · UART polling</text>

  <!-- MAIN_MENU -->
  <rect x="400" y="208" width="300" height="64" rx="10" class="state" stroke="#f59e0b" stroke-width="2"/>
  <rect x="400" y="208" width="3" height="64" rx="1.5" fill="#f59e0b"/>
  <circle cx="422" cy="228" r="10" class="badge" stroke="#f59e0b" stroke-width="1.2"/>
  <use href="#i-flow" x="416" y="222" width="11" height="11" color="#f59e0b"/>
  <text x="555" y="233" text-anchor="middle" class="n-title" fill="#fbbf24">MAIN_MENU</text>
  <text x="550" y="256" text-anchor="middle" class="n-sub">Navigate: 5 items (SET, DISP, COLOR, INT, UART)</text>

  <!-- NORMAL → MAIN_MENU -->
  <path d="M 550 164 L 550 206" stroke="#3b82f6" stroke-width="1.75" fill="none" marker-end="url(#arr-fwd)"/>
  <rect x="557" y="176" width="64" height="18" rx="4" class="card" stroke="#3b82f6" stroke-width="1"/>
  <text x="589" y="189" text-anchor="middle" class="tlbl" fill="#93c5fd">SEL(3)</text>

  <!-- Sub-state row 1: SET_TIME_H, SET_TIME_M, TOGGLE_DISPLAY -->
  <rect x="160" y="344" width="220" height="56" rx="9" class="state" stroke="#3b82f6" stroke-width="2"/>
  <rect x="160" y="344" width="3" height="56" rx="1.5" fill="#3b82f6"/>
  <circle cx="182" cy="364" r="10" class="badge" stroke="#3b82f6" stroke-width="1.2"/>
  <use href="#i-clock" x="176" y="358" width="11" height="11" color="#3b82f6"/>
  <text x="270" y="370" text-anchor="middle" class="n-title" fill="#93c5fd">SET_TIME_H</text>
  <text x="270" y="388" text-anchor="middle" class="n-sub">Hours (0-23)</text>

  <rect x="400" y="344" width="220" height="56" rx="9" class="state" stroke="#3b82f6" stroke-width="2"/>
  <rect x="400" y="344" width="3" height="56" rx="1.5" fill="#3b82f6"/>
  <circle cx="422" cy="364" r="10" class="badge" stroke="#3b82f6" stroke-width="1.2"/>
  <use href="#i-clock" x="416" y="358" width="11" height="11" color="#3b82f6"/>
  <text x="510" y="370" text-anchor="middle" class="n-title" fill="#93c5fd">SET_TIME_M</text>
  <text x="510" y="388" text-anchor="middle" class="n-sub">Minutes (0-59)</text>

  <rect x="680" y="344" width="220" height="56" rx="9" class="state" stroke="#ec4899" stroke-width="2"/>
  <rect x="680" y="344" width="3" height="56" rx="1.5" fill="#ec4899"/>
  <circle cx="702" cy="364" r="10" class="badge" stroke="#ec4899" stroke-width="1.2"/>
  <use href="#i-display" x="696" y="358" width="11" height="11" color="#ec4899"/>
  <text x="790" y="370" text-anchor="middle" class="n-title" fill="#f472b6">TOGGLE_DISPLAY</text>
  <text x="790" y="388" text-anchor="middle" class="n-sub">On / Off</text>

  <!-- Sub-state row 2: SET_COLOR, UART_INTERVAL, UART_TOGGLE -->
  <rect x="160" y="436" width="220" height="56" rx="9" class="state" stroke="#a855f7" stroke-width="2"/>
  <rect x="160" y="436" width="3" height="56" rx="1.5" fill="#a855f7"/>
  <circle cx="182" cy="456" r="10" class="badge" stroke="#a855f7" stroke-width="1.2"/>
  <use href="#i-flow" x="176" y="450" width="11" height="11" color="#a855f7"/>
  <text x="270" y="462" text-anchor="middle" class="n-title" fill="#c084fc">SET_COLOR</text>
  <text x="270" y="480" text-anchor="middle" class="n-sub">LED color (0=R, 1=G, 2=B)</text>

  <rect x="400" y="436" width="220" height="56" rx="9" class="state" stroke="#f59e0b" stroke-width="2"/>
  <rect x="400" y="436" width="3" height="56" rx="1.5" fill="#f59e0b"/>
  <circle cx="422" cy="456" r="10" class="badge" stroke="#f59e0b" stroke-width="1.2"/>
  <use href="#i-uart" x="416" y="450" width="11" height="11" color="#f59e0b"/>
  <text x="510" y="462" text-anchor="middle" class="n-title" fill="#fbbf24">UART_INTERVAL</text>
  <text x="510" y="480" text-anchor="middle" class="n-sub">Interval (1-99s)</text>

  <rect x="680" y="436" width="220" height="56" rx="9" class="state" stroke="#ec4899" stroke-width="2"/>
  <rect x="680" y="436" width="3" height="56" rx="1.5" fill="#ec4899"/>
  <circle cx="702" cy="456" r="10" class="badge" stroke="#ec4899" stroke-width="1.2"/>
  <use href="#i-uart" x="696" y="450" width="11" height="11" color="#ec4899"/>
  <text x="790" y="462" text-anchor="middle" class="n-title" fill="#f472b6">UART_TOGGLE</text>
  <text x="790" y="480" text-anchor="middle" class="n-sub">On / Off</text>

  <!-- MAIN_MENU → sub-state transitions -->
  <path d="M 430 272 C 320 290 290 310 280 340" stroke="#f59e0b" stroke-width="1.75" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="316" y="296" width="64" height="18" rx="4" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="348" y="309" text-anchor="middle" class="tlbl" fill="#fbbf24">SEL @ 0</text>

  <path d="M 595 272 C 660 290 720 310 780 340" stroke="#f59e0b" stroke-width="1.75" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="678" y="300" width="64" height="18" rx="4" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="710" y="313" text-anchor="middle" class="tlbl" fill="#fbbf24">SEL @ 1</text>

  <path d="M 430 272 C 320 312 290 380 268 432" stroke="#f59e0b" stroke-width="1.75" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="316" y="382" width="64" height="18" rx="4" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="348" y="395" text-anchor="middle" class="tlbl" fill="#fbbf24">SEL @ 2</text>

  <path d="M 550 272 L 550 432" stroke="#f59e0b" stroke-width="1.75" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="518" y="350" width="64" height="18" rx="4" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="550" y="363" text-anchor="middle" class="tlbl" fill="#fbbf24">SEL @ 3</text>

  <path d="M 670 272 C 790 312 790 380 792 432" stroke="#f59e0b" stroke-width="1.75" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="758" y="382" width="64" height="18" rx="4" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="790" y="395" text-anchor="middle" class="tlbl" fill="#fbbf24">SEL @ 4</text>

  <!-- SET_TIME_H → SET_TIME_M -->
  <path d="M 380 372 L 396 372" stroke="#3b82f6" stroke-width="1.75" fill="none" marker-end="url(#arr-fwd)"/>
  <rect x="380" y="376" width="42" height="16" rx="4" class="card" stroke="#3b82f6" stroke-width="1"/>
  <text x="401" y="388" text-anchor="middle" class="tlbl" font-size="9" fill="#93c5fd">SEL(3)</text>

  <!-- Save returns to NORMAL — dashed green -->
  <path d="M 400 396 C 130 420 130 160 400 132" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-save)"/>
  <rect x="120" y="278" width="70" height="18" rx="4" class="card" stroke="#22c55e" stroke-width="1"/>
  <text x="155" y="291" text-anchor="middle" class="tlbl" fill="#86efac">SEL save</text>

  <path d="M 680 396 C 150 432 150 150 500 132" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-save)"/>
  <rect x="120" y="360" width="70" height="18" rx="4" class="card" stroke="#22c55e" stroke-width="1"/>
  <text x="155" y="373" text-anchor="middle" class="tlbl" fill="#86efac">SEL save</text>

  <path d="M 160 488 C 100 528 100 150 450 132" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-save)"/>
  <rect x="80" y="434" width="70" height="18" rx="4" class="card" stroke="#22c55e" stroke-width="1"/>
  <text x="115" y="447" text-anchor="middle" class="tlbl" fill="#86efac">SEL save</text>

  <path d="M 620 488 C 920 528 920 150 600 132" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-save)"/>
  <rect x="820" y="434" width="70" height="18" rx="4" class="card" stroke="#22c55e" stroke-width="1"/>
  <text x="855" y="447" text-anchor="middle" class="tlbl" fill="#86efac">SEL save</text>

  <path d="M 900 488 C 970 510 970 150 650 132" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-save)"/>
  <rect x="870" y="356" width="70" height="18" rx="4" class="card" stroke="#22c55e" stroke-width="1"/>
  <text x="905" y="369" text-anchor="middle" class="tlbl" fill="#86efac">SEL save</text>

  <!-- LEGEND panel -->
  <rect x="40" y="528" width="1020" height="156" rx="10" fill="#121a2c" stroke="#26344d" stroke-width="1.25"/>
  <use href="#i-chip" x="60" y="542" width="13" height="13" color="#e2e8f0"/>
  <text x="82" y="554" class="sec-t" fill="#e2e8f0">Legend & Transition Types</text>
  <text x="290" y="554" class="sec-s">state colours · arrow semantics · debounce behaviour</text>

  <!-- State colour swatches -->
  <rect x="70" y="574" width="22" height="14" rx="3" class="state" stroke="#22c55e" stroke-width="1.5"/>
  <text x="102" y="586" class="n-sub">Default / clock state</text>
  <rect x="70" y="594" width="22" height="14" rx="3" class="state" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="102" y="606" class="n-sub">Menu navigation</text>
  <rect x="70" y="614" width="22" height="14" rx="3" class="state" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="102" y="626" class="n-sub">Time-setting sub-states</text>
  <rect x="70" y="634" width="22" height="14" rx="3" class="state" stroke="#ec4899" stroke-width="1.5"/>
  <text x="102" y="646" class="n-sub">Toggle / UART sub-states</text>
  <rect x="70" y="654" width="22" height="14" rx="3" class="state" stroke="#a855f7" stroke-width="1.5"/>
  <text x="102" y="666" class="n-sub">Color selection sub-state</text>

  <!-- Arrow legend -->
  <line x1="380" y1="586" x2="448" y2="586" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#arr-fwd)"/>
  <text x="460" y="590" class="n-sub">Enter sub-state / next (forward)</text>
  <line x1="380" y1="616" x2="448" y2="616" stroke="#f59e0b" stroke-width="1.75" marker-end="url(#arr-sub)"/>
  <text x="460" y="620" class="n-sub">Menu→sub based on menu index (0-4)</text>
  <line x1="380" y1="646" x2="448" y2="646" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-save)"/>
  <text x="460" y="650" class="n-sub">Save and return to NORMAL</text>

  <text x="550" y="674" text-anchor="middle" class="n-micro">All transitions triggered by SW3 (SEL) — press-and-hold 1.5s in NORMAL to enter MAIN_MENU</text>

  <!-- Navigation Rules panel -->
  <rect x="40" y="702" width="1020" height="100" rx="10" fill="#121a2c" stroke="#26344d" stroke-width="1.25"/>
  <use href="#i-flow" x="60" y="716" width="13" height="13" color="#22d3ee"/>
  <text x="82" y="728" class="sec-t" fill="#67e8f9">Navigation Rules</text>
  <text x="290" y="728" class="sec-s">3-button ordered navigation · 250 ms debounce</text>
  <text x="60" y="754" class="n-sub">1. NORMAL → press SW3 for 1.5s → MAIN_MENU</text>
  <text x="60" y="774" class="n-sub">2. MAIN_MENU: SW1(UP) / SW2(DOWN) cycles through 5 items; SW3(SEL) enters selected sub-state</text>
  <text x="60" y="794" class="n-sub">3. Sub-state: SW1/SW2 adjust value; SW3 confirms, saves to EEPROM, returns to NORMAL</text>

  <text x="1060" y="906" text-anchor="end" class="foot">DIAGRAM 3 / 6 — FINITE STATE MACHINE</text>
</svg>
