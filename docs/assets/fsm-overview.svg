<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <marker id="arr-fwd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="arr-save" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="arr-sub" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f59e0b"/></marker>
    <pattern id="s-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#1b2438"/></pattern>
    <symbol id="i-clock"   viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="8" x2="8" y2="4"/><line x1="8" y1="8" x2="11" y2="9.5"/></symbol>
    <symbol id="i-menu"    viewBox="0 0 16 16"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></symbol>
    <symbol id="i-display" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="8" y1="8" x2="8" y2="12"/></symbol>
    <symbol id="i-palette" viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13c1 0 1.2-1 .5-1.6-.6-.5-.3-1.4.6-1.4H10a3 3 0 0 0 3-3c0-3.8-2.2-7-5-7Z"/><circle cx="5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="4.5" r="1" fill="currentColor" stroke="none"/><circle cx="11" cy="6" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-uart"    viewBox="0 0 16 16"><path d="M2 13 Q8 2 14 13"/><path d="M5 13 Q8 8 11 13"/><circle cx="8" cy="13" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-toggle"  viewBox="0 0 16 16"><rect x="1" y="5" width="14" height="6" rx="3"/><circle cx="11" cy="8" r="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-flow"    viewBox="0 0 16 16"><path d="M1 8 L11 8"/><path d="M8 5 L11 8 L8 11"/></symbol>
  </defs>

  <style>
    .kicker  { font: 700 9.5px 'JetBrains Mono',monospace; letter-spacing:1.4px; fill:#22c55e; }
    .title   { font: 700 18px 'JetBrains Mono',monospace; fill:#f8fafc; }
    .subtitle{ font: 11px 'JetBrains Mono',monospace; fill:#64748b; }
    .corner  { font: 9.5px 'JetBrains Mono',monospace; fill:#475569; }
    .foot    { font: 9px 'JetBrains Mono',monospace; fill:#3a475c; letter-spacing:.4px; }
    .st-title{ font: 700 15px 'JetBrains Mono',monospace; }
    .st-sub  { font: 10.5px 'JetBrains Mono',monospace; fill:#8b98ac; }
    .tr-lbl  { font: 700 10px 'JetBrains Mono',monospace; }
    .sec-t   { font: 700 13.5px 'JetBrains Mono',monospace; fill:#e2e8f0; }
    .leg-t   { font: 10.5px 'JetBrains Mono',monospace; fill:#8b98ac; }
    .note    { font: 10px 'JetBrains Mono',monospace; fill:#64748b; }
  </style>

  <rect width="1100" height="920" fill="#0f172a" rx="10"/>
  <rect width="1100" height="920" fill="url(#s-grid)" rx="10"/>
  <rect x="10" y="10" width="1080" height="900" fill="none" stroke="#334155" stroke-width="1.5" rx="8"/>
  <rect x="26" y="20" width="1048" height="3" rx="1.5" fill="#22c55e" opacity="0.85"/>

  <!-- Header -->
  <text x="40" y="42" class="kicker">ENGINEERING DIAGRAM · 03 / 06</text>
  <text x="550" y="48" text-anchor="middle" class="title">Finite State Machine — 8 States · 12 Transitions</text>
  <text x="550" y="67" text-anchor="middle" class="subtitle">::FSM_STATES / ::FSM_TRANSITIONS — SW1(UP)=PB13 · SW2(DOWN)=PB14 · SW3(SEL)=PB15</text>
  <use href="#i-clock" x="1030" y="30" width="14" height="14" color="#475569"/>
  <text x="1060" y="42" text-anchor="end" class="corner">STM32G030 · Smart Clock Sim</text>
  <line x1="40" y1="80" x2="1060" y2="80" stroke="#1c2740" stroke-width="1"/>

  <!-- NORMAL state -->
  <rect x="400" y="85" width="300" height="65" rx="12" fill="#0e1f16" stroke="#22c55e" stroke-width="3"/>
  <use href="#i-clock" x="418" y="98" width="15" height="15" color="#4ade80"/>
  <text x="550" y="114" text-anchor="middle" class="st-title" fill="#4ade80">NORMAL (clock)</text>
  <text x="550" y="136" text-anchor="middle" class="st-sub">Display HH:MM · PWM LED · UART polling</text>

  <!-- MAIN_MENU state -->
  <rect x="400" y="205" width="300" height="65" rx="10" fill="#211a0d" stroke="#f59e0b" stroke-width="2.5"/>
  <use href="#i-menu" x="418" y="218" width="15" height="15" color="#fbbf24"/>
  <text x="550" y="234" text-anchor="middle" class="st-title" fill="#fbbf24">MAIN_MENU</text>
  <text x="550" y="256" text-anchor="middle" class="st-sub">Navigate: 5 items (SET, DISP, COLOR, INT, UART)</text>

  <!-- NORMAL → MAIN_MENU -->
  <path d="M 550 150 L 550 200" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-fwd)"/>
  <rect x="555" y="168" width="90" height="22" rx="5" fill="#16233a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="184" text-anchor="middle" class="tr-lbl" fill="#93c5fd">SEL(3)</text>

  <!-- Sub-state row 1 -->
  <rect x="160" y="340" width="220" height="55" rx="8" fill="#0e1a2c" stroke="#3b82f6" stroke-width="2.5"/>
  <use href="#i-clock" x="176" y="349" width="14" height="14" color="#93c5fd"/>
  <text x="278" y="365" text-anchor="middle" class="st-title" font-size="13.5" fill="#93c5fd">SET_TIME_H</text>
  <text x="270" y="383" text-anchor="middle" class="st-sub">Hours (0-23)</text>

  <rect x="400" y="340" width="220" height="55" rx="8" fill="#0e1a2c" stroke="#3b82f6" stroke-width="2.5"/>
  <use href="#i-clock" x="416" y="349" width="14" height="14" color="#93c5fd"/>
  <text x="518" y="365" text-anchor="middle" class="st-title" font-size="13.5" fill="#93c5fd">SET_TIME_M</text>
  <text x="510" y="383" text-anchor="middle" class="st-sub">Minutes (0-59)</text>

  <rect x="680" y="340" width="220" height="55" rx="8" fill="#20111c" stroke="#ec4899" stroke-width="2.5"/>
  <use href="#i-toggle" x="694" y="349" width="14" height="14" color="#f472b6"/>
  <text x="800" y="365" text-anchor="middle" class="st-title" font-size="13.5" fill="#f472b6">TOGGLE_DISPLAY</text>
  <text x="790" y="383" text-anchor="middle" class="st-sub">On / Off</text>

  <!-- Sub-state row 2 -->
  <rect x="160" y="440" width="220" height="55" rx="8" fill="#1b1329" stroke="#a855f7" stroke-width="2.5"/>
  <use href="#i-palette" x="176" y="449" width="14" height="14" color="#c084fc"/>
  <text x="278" y="465" text-anchor="middle" class="st-title" font-size="13.5" fill="#c084fc">SET_COLOR</text>
  <text x="270" y="483" text-anchor="middle" class="st-sub">LED color (0=R, 1=G, 2=B)</text>

  <rect x="400" y="440" width="220" height="55" rx="8" fill="#211a0d" stroke="#f59e0b" stroke-width="2.5"/>
  <use href="#i-uart" x="416" y="449" width="14" height="14" color="#fbbf24"/>
  <text x="522" y="465" text-anchor="middle" class="st-title" font-size="13.5" fill="#fbbf24">UART_INTERVAL</text>
  <text x="510" y="483" text-anchor="middle" class="st-sub">Interval (1-99s)</text>

  <rect x="680" y="440" width="220" height="55" rx="8" fill="#20111c" stroke="#ec4899" stroke-width="2.5"/>
  <use href="#i-uart" x="694" y="449" width="14" height="14" color="#f472b6"/>
  <text x="802" y="465" text-anchor="middle" class="st-title" font-size="13.5" fill="#f472b6">UART_TOGGLE</text>
  <text x="790" y="483" text-anchor="middle" class="st-sub">On / Off</text>

  <!-- MAIN_MENU → sub-state transitions -->
  <path d="M 420 270 C 300 290 280 310 270 335" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="290" y="288" width="80" height="20" rx="4" fill="#16233a" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="330" y="303" text-anchor="middle" class="tr-lbl" fill="#fbbf24">SEL @ 0</text>

  <path d="M 600 270 C 660 290 700 310 790 335" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="670" y="300" width="80" height="20" rx="4" fill="#16233a" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="710" y="315" text-anchor="middle" class="tr-lbl" fill="#fbbf24">SEL @ 1</text>

  <path d="M 420 270 C 300 310 280 360 270 435" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="290" y="370" width="80" height="20" rx="4" fill="#16233a" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="330" y="385" text-anchor="middle" class="tr-lbl" fill="#fbbf24">SEL @ 2</text>

  <path d="M 550 270 L 550 435" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="495" y="360" width="110" height="20" rx="4" fill="#16233a" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="550" y="375" text-anchor="middle" class="tr-lbl" fill="#fbbf24">SEL @ 3</text>

  <path d="M 680 270 C 780 310 790 360 790 435" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arr-sub)"/>
  <rect x="700" y="370" width="80" height="20" rx="4" fill="#16233a" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="740" y="385" text-anchor="middle" class="tr-lbl" fill="#fbbf24">SEL @ 4</text>

  <!-- SET_TIME_H → SET_TIME_M -->
  <path d="M 380 367 L 395 367" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <rect x="385" y="370" width="62" height="18" rx="4" fill="#16233a" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="416" y="383" text-anchor="middle" class="tr-lbl" fill="#93c5fd">SEL(3)</text>

  <!-- Save returns to NORMAL — curved paths -->
  <path d="M 400 395 C 120 420 120 160 400 140" stroke="#22c55e" stroke-width="2" stroke-dasharray="7,4" fill="none" marker-end="url(#arr-save)" opacity="0.9"/>
  <rect x="120" y="280" width="100" height="20" rx="4" fill="#12261a" stroke="#22c55e" stroke-width="1.25"/>
  <text x="170" y="295" text-anchor="middle" class="tr-lbl" fill="#4ade80">SEL (save)</text>

  <path d="M 680 395 C 140 430 140 150 500 150" stroke="#22c55e" stroke-width="1.75" stroke-dasharray="7,4" fill="none" marker-end="url(#arr-save)" opacity="0.9"/>
  <rect x="120" y="340" width="100" height="20" rx="4" fill="#12261a" stroke="#22c55e" stroke-width="1.25"/>
  <text x="170" y="355" text-anchor="middle" class="tr-lbl" fill="#4ade80">SEL (save)</text>

  <path d="M 160 495 C 100 530 100 150 450 150" stroke="#22c55e" stroke-width="1.75" stroke-dasharray="7,4" fill="none" marker-end="url(#arr-save)" opacity="0.9"/>
  <rect x="80" y="420" width="100" height="20" rx="4" fill="#12261a" stroke="#22c55e" stroke-width="1.25"/>
  <text x="130" y="435" text-anchor="middle" class="tr-lbl" fill="#4ade80">SEL (save)</text>

  <path d="M 620 495 C 920 530 920 150 600 150" stroke="#22c55e" stroke-width="1.75" stroke-dasharray="7,4" fill="none" marker-end="url(#arr-save)" opacity="0.9"/>
  <rect x="820" y="420" width="100" height="20" rx="4" fill="#12261a" stroke="#22c55e" stroke-width="1.25"/>
  <text x="870" y="435" text-anchor="middle" class="tr-lbl" fill="#4ade80">SEL (save)</text>

  <path d="M 900 475 C 960 500 960 150 650 150" stroke="#22c55e" stroke-width="1.75" stroke-dasharray="7,4" fill="none" marker-end="url(#arr-save)" opacity="0.9"/>
  <rect x="870" y="350" width="100" height="20" rx="4" fill="#12261a" stroke="#22c55e" stroke-width="1.25"/>
  <text x="920" y="365" text-anchor="middle" class="tr-lbl" fill="#4ade80">SEL (save)</text>

  <!-- LEGEND -->
  <rect x="40" y="536" width="1020" height="164" rx="10" fill="#121a2c" stroke="#26344d" stroke-width="1.25"/>
  <text x="550" y="562" text-anchor="middle" class="sec-t">Legend &amp; Transition Types</text>

  <rect x="70" y="580" width="20" height="13" rx="3" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <text x="102" y="592" class="leg-t">Default / clock state</text>
  <rect x="70" y="603" width="20" height="13" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="102" y="615" class="leg-t">Menu navigation</text>
  <rect x="70" y="626" width="20" height="13" rx="3" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="102" y="638" class="leg-t">Time-setting sub-states</text>
  <rect x="70" y="649" width="20" height="13" rx="3" fill="none" stroke="#ec4899" stroke-width="2.5"/>
  <text x="102" y="661" class="leg-t">Toggle / interval sub-states</text>
  <rect x="70" y="672" width="20" height="13" rx="3" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <text x="102" y="684" class="leg-t">Color selection sub-state</text>

  <line x1="410" y1="587" x2="470" y2="587" stroke="#3b82f6" stroke-width="2.25" marker-end="url(#arr-fwd)"/>
  <text x="482" y="592" class="leg-t">Enter sub-state / next (forward)</text>
  <line x1="410" y1="621" x2="470" y2="621" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#arr-sub)"/>
  <text x="482" y="626" class="leg-t">Menu → sub-state, by menu index (0-4)</text>
  <line x1="410" y1="655" x2="470" y2="655" stroke="#22c55e" stroke-width="2.25" stroke-dasharray="7,4" marker-end="url(#arr-save)"/>
  <text x="482" y="660" class="leg-t">Save value &amp; return to NORMAL</text>

  <text x="550" y="690" text-anchor="middle" class="note">All transitions triggered by SW3 (SEL) — press-and-hold 1.5s in NORMAL to enter MAIN_MENU</text>

  <!-- Navigation rules -->
  <rect x="40" y="710" width="1020" height="106" rx="10" fill="#0d1420" stroke="#26344d" stroke-width="1.25"/>
  <use href="#i-flow" x="60" y="722" width="13" height="13" color="#cbd5e1"/>
  <text x="82" y="734" class="sec-t" font-size="13">Navigation Rules</text>
  <text x="60" y="758" class="st-sub" font-size="11.5">1.  NORMAL — press SW3 for 1.5 s → MAIN_MENU</text>
  <text x="60" y="780" class="st-sub" font-size="11.5">2.  MAIN_MENU — SW1(UP) / SW2(DOWN) cycles 5 items; SW3(SEL) enters the selected sub-state</text>
  <text x="60" y="802" class="st-sub" font-size="11.5">3.  Sub-state — SW1/SW2 adjust the value; SW3 confirms, saves to EEPROM, returns to NORMAL</text>

  <text x="1060" y="906" text-anchor="end" class="foot">DIAGRAM 3 / 6 — FSM OVERVIEW</text>
</svg>
