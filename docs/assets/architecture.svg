<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <linearGradient id="ga-app" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182338"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="ga-hal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1832"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="ga-drv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20182a"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="ga-cms" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221d16"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="ga-hw"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241618"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <pattern id="a-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1b2438"/>
    </pattern>
    <symbol id="i-flow"  viewBox="0 0 16 16"><path d="M1 8 L11 8"/><path d="M8 5 L11 8 L8 11"/></symbol>
    <symbol id="i-therm" viewBox="0 0 16 16"><rect x="6" y="1" width="4" height="9" rx="2"/><circle cx="8" cy="12.5" r="2.5"/></symbol>
    <symbol id="i-display" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="8" y1="8" x2="8" y2="12"/></symbol>
    <symbol id="i-uart"  viewBox="0 0 16 16"><path d="M2 13 Q8 2 14 13"/><path d="M5 13 Q8 8 11 13"/><circle cx="8" cy="13" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-eeprom" viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="8" rx="1"/><line x1="5" y1="6" x2="11" y2="6"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="5" y1="10" x2="11" y2="10"/><line x1="1" y1="6" x2="3" y2="6"/><line x1="1" y1="10" x2="3" y2="10"/><line x1="13" y1="6" x2="15" y2="6"/><line x1="13" y1="10" x2="15" y2="10"/></symbol>
    <symbol id="i-gpio"  viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="5"/><line x1="8" y1="11" x2="8" y2="15"/></symbol>
    <symbol id="i-adc"   viewBox="0 0 16 16"><path d="M1 11 Q3 3 5 11 T9 11"/><path d="M9 11 L11 11 L11 5 L13 5 L13 11 L15 11"/></symbol>
    <symbol id="i-pwm"   viewBox="0 0 16 16"><path d="M1 12 L1 5 L5 5 L5 12 L9 12 L9 5 L13 5 L13 12 L15 12"/></symbol>
    <symbol id="i-i2c"   viewBox="0 0 16 16"><line x1="1" y1="5" x2="15" y2="5"/><line x1="1" y1="11" x2="15" y2="11"/><line x1="4" y1="3" x2="4" y2="7"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="12" y1="3" x2="12" y2="7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="8" x2="8" y2="4"/><line x1="8" y1="8" x2="11" y2="9.5"/></symbol>
    <symbol id="i-dma"   viewBox="0 0 16 16"><path d="M1 6 L8 6 L8 2 L15 8 L8 14 L8 10 L1 10 Z"/></symbol>
    <symbol id="i-chip"  viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/><line x1="1" y1="6" x2="4" y2="6"/><line x1="1" y1="10" x2="4" y2="10"/><line x1="12" y1="6" x2="15" y2="6"/><line x1="12" y1="10" x2="15" y2="10"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="6" y1="12" x2="6" y2="15"/><line x1="10" y1="12" x2="10" y2="15"/></symbol>
    <symbol id="i-warn"  viewBox="0 0 16 16"><path d="M8 1.5 L15 14 L1 14 Z"/><line x1="8" y1="6" x2="8" y2="10"/><circle cx="8" cy="12" r="0.7" fill="currentColor" stroke="none"/></symbol>
  </defs>

  <style>
    .kicker  { font: 700 9.5px 'JetBrains Mono',monospace; letter-spacing:1.4px; fill:#3b82f6; }
    .title   { font: 700 19px 'JetBrains Mono',monospace; fill:#f8fafc; }
    .subtitle{ font: 11px 'JetBrains Mono',monospace; fill:#64748b; }
    .corner  { font: 9.5px 'JetBrains Mono',monospace; fill:#475569; }
    .sec-t   { font: 700 13.5px 'JetBrains Mono',monospace; }
    .sec-s   { font: 9.5px 'JetBrains Mono',monospace; fill:#5b6b80; }
    .card    { fill:#141d31; stroke:#263349; stroke-width:1.25; }
    .n-title { font: 700 12.5px 'JetBrains Mono',monospace; fill:#f1f5f9; }
    .n-sub   { font: 10px 'JetBrains Mono',monospace; fill:#8b98ac; }
    .n-micro { font: 8.8px 'JetBrains Mono',monospace; fill:#5b6b80; }
    .foot    { font: 9px 'JetBrains Mono',monospace; fill:#3a475c; letter-spacing:.4px; }
    .badge   { fill:#0b111e; }
  </style>

  <rect width="1100" height="920" fill="#0f172a" rx="10"/>
  <rect width="1100" height="920" fill="url(#a-grid)" rx="10"/>
  <rect x="10" y="10" width="1080" height="900" fill="none" stroke="#334155" stroke-width="1.5" rx="8"/>
  <rect x="26" y="20" width="1048" height="3" rx="1.5" fill="#3b82f6" opacity="0.85"/>

  <!-- Header -->
  <text x="40" y="42" class="kicker">ENGINEERING DIAGRAM · 01 / 06</text>
  <text x="550" y="48" text-anchor="middle" class="title">System Architecture</text>
  <text x="550" y="67" text-anchor="middle" class="subtitle">STM32 Smart Clock — MCU: STM32G030 (Cortex-M0+) · HCLK 8 MHz (HSI 16 MHz ÷ 2) · bare-metal super-loop</text>
  <use href="#i-chip" x="1030" y="30" width="14" height="14" color="#475569"/>
  <text x="1060" y="42" text-anchor="end" class="corner">STM32G030 · Smart Clock Sim</text>
  <line x1="40" y1="80" x2="1060" y2="80" stroke="#1c2740" stroke-width="1"/>

  <!-- LAYER 0: APPLICATION -->
  <rect x="40" y="92" width="1020" height="214" rx="10" fill="url(#ga-app)" stroke="#3b82f6" stroke-width="1.75"/>
  <use href="#i-flow" x="60" y="103" width="13" height="13" color="#93c5fd"/>
  <text x="80" y="114" class="sec-t" fill="#93c5fd">APPLICATION LAYER</text>
  <text x="242" y="114" class="sec-s">— all logic lives in main.c</text>

  <!-- 5 module cards -->
  <g>
    <rect x="60"  y="128" width="182" height="94" rx="7" class="card"/>
    <rect x="60"  y="128" width="3" height="94" rx="1.5" fill="#3b82f6"/>
    <circle cx="80" cy="148" r="11" class="badge" stroke="#3b82f6" stroke-width="1.2"/>
    <use href="#i-flow" x="74" y="142" width="12" height="12" color="#3b82f6"/>
    <text x="97" y="152" class="n-title">Menu / FSM</text>
    <text x="76" y="176" class="n-sub">Execute_Button_Action()</text>
    <text x="76" y="196" class="n-micro">8-state FSM · PB13/14/15</text>
  </g>
  <g>
    <rect x="256" y="128" width="182" height="94" rx="7" class="card"/>
    <rect x="256" y="128" width="3" height="94" rx="1.5" fill="#22c55e"/>
    <circle cx="276" cy="148" r="11" class="badge" stroke="#22c55e" stroke-width="1.2"/>
    <use href="#i-therm" x="270" y="142" width="12" height="12" color="#22c55e"/>
    <text x="293" y="152" class="n-title">Temperature</text>
    <text x="272" y="176" class="n-sub">Update_Temperature_LED()</text>
    <text x="272" y="196" class="n-micro">ADC → Beta eq → PWM duty</text>
  </g>
  <g>
    <rect x="452" y="128" width="182" height="94" rx="7" class="card"/>
    <rect x="452" y="128" width="3" height="94" rx="1.5" fill="#a855f7"/>
    <circle cx="472" cy="148" r="11" class="badge" stroke="#a855f7" stroke-width="1.2"/>
    <use href="#i-display" x="466" y="142" width="12" height="12" color="#a855f7"/>
    <text x="489" y="152" class="n-title">Display</text>
    <text x="468" y="176" class="n-sub">Refresh_Display_Output()</text>
    <text x="468" y="196" class="n-micro">TM1637 · HAL_RTC_GetTime</text>
  </g>
  <g>
    <rect x="648" y="128" width="182" height="94" rx="7" class="card"/>
    <rect x="648" y="128" width="3" height="94" rx="1.5" fill="#f59e0b"/>
    <circle cx="668" cy="148" r="11" class="badge" stroke="#f59e0b" stroke-width="1.2"/>
    <use href="#i-uart" x="662" y="142" width="12" height="12" color="#f59e0b"/>
    <text x="685" y="152" class="n-title">UART Report</text>
    <text x="664" y="176" class="n-sub">Handle_UART_Transmission()</text>
    <text x="664" y="196" class="n-micro">9600 8N1 · 5 s interval</text>
  </g>
  <g>
    <rect x="844" y="128" width="176" height="94" rx="7" class="card"/>
    <rect x="844" y="128" width="3" height="94" rx="1.5" fill="#ef4444"/>
    <circle cx="864" cy="148" r="11" class="badge" stroke="#ef4444" stroke-width="1.2"/>
    <use href="#i-eeprom" x="858" y="142" width="12" height="12" color="#ef4444"/>
    <text x="881" y="152" class="n-title">Settings</text>
    <text x="860" y="176" class="n-sub">Load/Save EEPROM()</text>
    <text x="860" y="196" class="n-micro">I²C 0xA0 · boot_count++</text>
  </g>

  <!-- Super loop annotation -->
  <rect x="60" y="236" width="960" height="56" rx="8" fill="#0d1626" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3"/>
  <use href="#i-flow" x="76" y="252" width="13" height="13" color="#67e8f9"/>
  <text x="96" y="262" class="n-title" fill="#67e8f9">Super Loop — while(1)</text>
  <text x="96" y="280" class="n-sub" fill="#8b98ac">HAL_GetTick → Display@1s → button poll (250ms) → Temp (ADC+Beta+PWM) → UART@5s → HAL_Delay(5)</text>

  <!-- LAYER 1: HAL -->
  <rect x="40" y="316" width="1020" height="124" rx="10" fill="url(#ga-hal)" stroke="#a855f7" stroke-width="1.75"/>
  <use href="#i-chip" x="60" y="327" width="13" height="13" color="#c084fc"/>
  <text x="80" y="338" class="sec-t" fill="#c084fc">HARDWARE ABSTRACTION LAYER</text>
  <text x="298" y="338" class="sec-s">STM32G0xx HAL</text>

  <g font-family="'JetBrains Mono',monospace">
    <!-- 7 HAL module chips, evenly spaced -->
    <rect x="60"  y="354" width="130" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-gpio" x="70" y="365" width="14" height="14" color="#c084fc"/><text x="92" y="377" class="n-title" font-size="11.5">HAL_GPIO</text>
    <rect x="200" y="354" width="130" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-adc" x="210" y="365" width="14" height="14" color="#c084fc"/><text x="232" y="377" class="n-title" font-size="11.5">HAL_ADC</text>
    <rect x="340" y="354" width="130" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-pwm" x="350" y="365" width="14" height="14" color="#c084fc"/><text x="372" y="377" class="n-title" font-size="11.5">HAL_TIM</text>
    <rect x="480" y="354" width="130" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-i2c" x="490" y="365" width="14" height="14" color="#c084fc"/><text x="512" y="377" class="n-title" font-size="11.5">HAL_I2C</text>
    <rect x="620" y="354" width="130" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-clock" x="630" y="365" width="14" height="14" color="#c084fc"/><text x="652" y="377" class="n-title" font-size="11.5">HAL_RTC</text>
    <rect x="760" y="354" width="130" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-uart" x="770" y="365" width="14" height="14" color="#c084fc"/><text x="792" y="377" class="n-title" font-size="11.5">HAL_UART</text>
    <rect x="900" y="354" width="140" height="38" rx="6" class="card" stroke="#a855f7" stroke-width="1"/>
    <use href="#i-dma" x="910" y="365" width="14" height="14" color="#c084fc"/><text x="932" y="377" class="n-title" font-size="11.5">HAL_DMA</text>
  </g>
  <text x="60" y="412" class="n-micro">MX_GPIO_Init(358) · MX_ADC1_Init(360) · MX_I2C2_Init(361) · MX_USART2_UART_Init(362) · MX_TIM1_Init(363) · MX_RTC_Init(364) · MX_DMA_Init(359)</text>
  <use href="#i-warn" x="60" y="420" width="11" height="11" color="#f87171"/>
  <text x="78" y="430" class="n-micro" fill="#f87171">DMA configured but unused · ADC configured for continuous+DMA but polled manually every loop</text>

  <!-- LAYER 2: DRIVERS -->
  <rect x="40" y="452" width="1020" height="86" rx="10" fill="url(#ga-drv)" stroke="#ec4899" stroke-width="1.75"/>
  <use href="#i-flow" x="60" y="463" width="13" height="13" color="#f472b6"/>
  <text x="80" y="474" class="sec-t" fill="#f472b6">DRIVER LAYER</text>
  <text x="200" y="474" class="sec-s">custom + CubeMX-generated</text>

  <rect x="60"  y="490" width="222" height="32" rx="6" class="card" stroke="#ec4899" stroke-width="1"/>
  <use href="#i-display" x="70" y="499" width="14" height="14" color="#f472b6"/><text x="92" y="511" class="n-title" font-size="11">TM1637 Driver</text>
  <rect x="298" y="490" width="222" height="32" rx="6" class="card" stroke="#ec4899" stroke-width="1"/>
  <use href="#i-therm" x="308" y="499" width="14" height="14" color="#f472b6"/><text x="330" y="511" class="n-title" font-size="11">NTC Beta Math (inline)</text>
  <rect x="536" y="490" width="248" height="32" rx="6" class="card" stroke="#ec4899" stroke-width="1"/>
  <use href="#i-chip" x="546" y="499" width="14" height="14" color="#f472b6"/><text x="568" y="511" class="n-title" font-size="11">CubeMX MX_*_Init (all)</text>
  <rect x="800" y="490" width="260" height="32" rx="6" class="card" stroke="#ec4899" stroke-width="1"/>
  <use href="#i-flow" x="810" y="499" width="14" height="14" color="#f472b6"/><text x="832" y="511" class="n-title" font-size="11">Interrupt Handlers</text>

  <!-- LAYER 3: CMSIS-CORE -->
  <rect x="40" y="554" width="1020" height="76" rx="10" fill="url(#ga-cms)" stroke="#f59e0b" stroke-width="1.75"/>
  <use href="#i-chip" x="60" y="565" width="13" height="13" color="#fcd34d"/>
  <text x="80" y="576" class="sec-t" fill="#fcd34d">CMSIS-CORE</text>
  <text x="188" y="576" class="sec-s">Cortex-M0+ abstraction</text>

  <rect x="60"  y="592" width="222" height="28" rx="6" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="611" class="n-title" font-size="11">System Core</text>
  <rect x="298" y="592" width="222" height="28" rx="6" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="318" y="611" class="n-title" font-size="11">Startup Code</text>
  <rect x="536" y="592" width="222" height="28" rx="6" class="card" stroke="#f59e0b" stroke-width="1"/>
  <text x="556" y="611" class="n-title" font-size="11">NVIC</text>

  <!-- LAYER 4: HARDWARE -->
  <rect x="40" y="646" width="1020" height="124" rx="10" fill="url(#ga-hw)" stroke="#ef4444" stroke-width="1.75"/>
  <use href="#i-warn" x="60" y="657" width="13" height="13" color="#f87171"/>
  <text x="80" y="668" class="sec-t" fill="#f87171">HARDWARE</text>
  <text x="176" y="668" class="sec-s">STM32G030 + peripherals</text>

  <g>
    <rect x="60"  y="684" width="150" height="42" rx="6" class="card" stroke="#ef4444" stroke-width="1"/>
    <use href="#i-adc" x="70" y="694" width="14" height="14" color="#f87171"/><text x="92" y="706" class="n-title" font-size="11">ADC1 (PA0)</text><text x="72" y="720" class="n-micro">12-bit CH0</text>

    <rect x="222" y="684" width="150" height="42" rx="6" class="card" stroke="#ef4444" stroke-width="1"/>
    <use href="#i-pwm" x="232" y="694" width="14" height="14" color="#f87171"/><text x="254" y="706" class="n-title" font-size="11">TIM1 CH1-3</text><text x="234" y="720" class="n-micro">PWM 1 kHz</text>

    <rect x="384" y="684" width="150" height="42" rx="6" class="card" stroke="#ef4444" stroke-width="1"/>
    <use href="#i-i2c" x="394" y="694" width="14" height="14" color="#f87171"/><text x="416" y="706" class="n-title" font-size="11">I2C2</text><text x="396" y="720" class="n-micro">100 kHz</text>

    <rect x="546" y="684" width="150" height="42" rx="6" class="card" stroke="#ef4444" stroke-width="1"/>
    <use href="#i-uart" x="556" y="694" width="14" height="14" color="#f87171"/><text x="578" y="706" class="n-title" font-size="11">USART2</text><text x="558" y="720" class="n-micro">9600 8N1</text>

    <rect x="708" y="684" width="150" height="42" rx="6" class="card" stroke="#ef4444" stroke-width="1"/>
    <use href="#i-clock" x="718" y="694" width="14" height="14" color="#f87171"/><text x="740" y="706" class="n-title" font-size="11">RTC + LSE</text><text x="720" y="720" class="n-micro">32.768 kHz</text>

    <rect x="870" y="684" width="180" height="42" rx="6" class="card" stroke="#ef4444" stroke-width="1"/>
    <use href="#i-gpio" x="880" y="694" width="14" height="14" color="#f87171"/><text x="902" y="706" class="n-title" font-size="11">GPIO A/B/C/D</text><text x="884" y="720" class="n-micro">4 ports · AF1/2/6</text>
  </g>

  <!-- Startup sequence -->
  <rect x="60" y="786" width="980" height="50" rx="8" fill="#0d1626" stroke="#334155" stroke-width="1.25"/>
  <use href="#i-flow" x="76" y="798" width="12" height="12" color="#cbd5e1"/>
  <text x="96" y="807" class="n-title" font-size="11.5">Startup Sequence</text>
  <text x="550" y="826" text-anchor="middle" class="n-sub">Reset_Handler → SystemInit → HAL_Init → SystemClock_Config → MX_*_Init ×7 → ADC_Cal → Load_EEPROM → tm1637_init → PWM_Start → while(1)</text>

  <!-- Known issues -->
  <rect x="60" y="846" width="980" height="56" rx="8" fill="#1c1113" stroke="#ef4444" stroke-width="1.25"/>
  <use href="#i-warn" x="78" y="858" width="13" height="13" color="#f87171"/>
  <text x="98" y="868" class="n-title" font-size="11.5" fill="#f87171">Known Engineering Issues</text>
  <text x="78" y="886" class="n-sub" fill="#e2b8b8">ADC: DMA configured but unused — polled manually each loop (HAL_ADC_Start/Stop)</text>
  <text x="78" y="901" class="n-sub" fill="#e2b8b8">RTC: time resets to 00:36:00 on every boot — no backup-register persistence</text>

  <text x="1060" y="912" text-anchor="end" class="foot">DIAGRAM 1 / 6 — SYSTEM ARCHITECTURE</text>
</svg>
