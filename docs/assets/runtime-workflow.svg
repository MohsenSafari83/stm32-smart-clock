<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <marker id="arr-seq" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="arr-lp"  markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <pattern id="w-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#1b2438"/></pattern>
    <symbol id="i-clock"   viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="8" x2="8" y2="4"/><line x1="8" y1="8" x2="11" y2="9.5"/></symbol>
    <symbol id="i-display" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="8" y1="8" x2="8" y2="12"/></symbol>
    <symbol id="i-button"  viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3"/><circle cx="8" cy="8" r="2.5"/></symbol>
    <symbol id="i-therm"   viewBox="0 0 16 16"><rect x="6" y="1" width="4" height="9" rx="2"/><circle cx="8" cy="12.5" r="2.5"/></symbol>
    <symbol id="i-uart"    viewBox="0 0 16 16"><path d="M2 13 Q8 2 14 13"/><path d="M5 13 Q8 8 11 13"/><circle cx="8" cy="13" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-flow"    viewBox="0 0 16 16"><path d="M1 8 L11 8"/><path d="M8 5 L11 8 L8 11"/></symbol>
    <symbol id="i-chip"    viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/><line x1="1" y1="6" x2="4" y2="6"/><line x1="1" y1="10" x2="4" y2="10"/><line x1="12" y1="6" x2="15" y2="6"/><line x1="12" y1="10" x2="15" y2="10"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="6" y1="12" x2="6" y2="15"/><line x1="10" y1="12" x2="10" y2="15"/></symbol>
  </defs>

  <style>
    .kicker  { font: 700 9.5px 'JetBrains Mono',monospace; letter-spacing:1.4px; fill:#22d3ee; }
    .title   { font: 700 18px 'JetBrains Mono',monospace; fill:#f8fafc; }
    .subtitle{ font: 11px 'JetBrains Mono',monospace; fill:#64748b; }
    .corner  { font: 9.5px 'JetBrains Mono',monospace; fill:#475569; }
    .foot    { font: 9px 'JetBrains Mono',monospace; fill:#3a475c; letter-spacing:.4px; }
    .col-t   { font: 700 16px 'JetBrains Mono',monospace; }
    .col-s   { font: 11px 'JetBrains Mono',monospace; fill:#64748b; }
    .step-n  { font: 700 10.5px 'JetBrains Mono',monospace; }
    .step-f  { font: 700 11px 'JetBrains Mono',monospace; fill:#f8fafc; }
    .step-d  { font: 10px 'JetBrains Mono',monospace; fill:#94a3b8; }
    .ph-n    { font: 700 11px 'JetBrains Mono',monospace; }
    .ph-t    { font: 700 12px 'JetBrains Mono',monospace; fill:#f8fafc; }
    .ph-s    { font: 10.5px 'JetBrains Mono',monospace; fill:#94a3b8; }
    .ph-m    { font: 9.5px 'JetBrains Mono',monospace; fill:#64748b; }
    .sec-t   { font: 700 13.5px 'JetBrains Mono',monospace; fill:#e5e7eb; }
    .sub-t   { font: 700 12px 'JetBrains Mono',monospace; }
    .ref-t   { font: 11px 'JetBrains Mono',monospace; fill:#94a3b8; }
  </style>

  <rect width="1100" height="920" fill="#0f172a" rx="10"/>
  <rect width="1100" height="920" fill="url(#w-grid)" rx="10"/>
  <rect x="10" y="10" width="1080" height="900" fill="none" stroke="#334155" stroke-width="1.5" rx="8"/>
  <rect x="26" y="20" width="1048" height="3" rx="1.5" fill="#22d3ee" opacity="0.85"/>

  <!-- Header -->
  <text x="40" y="42" class="kicker">ENGINEERING DIAGRAM · 06 / 06</text>
  <text x="550" y="48" text-anchor="middle" class="title">Runtime Workflow — Boot Sequence &amp; Super Loop</text>
  <text x="550" y="67" text-anchor="middle" class="subtitle">::FW_INIT_SEQUENCE (15 steps) + ::FW_SUPERLOOP (6 phases) — HCLK: 8 MHz (HSI 16 MHz ÷ 2)</text>
  <use href="#i-chip" x="1030" y="30" width="14" height="14" color="#475569"/>
  <text x="1060" y="42" text-anchor="end" class="corner">STM32G030 · Smart Clock Sim</text>
  <line x1="40" y1="80" x2="1060" y2="80" stroke="#1c2740" stroke-width="1"/>

  <!-- LEFT: BOOT SEQUENCE -->
  <rect x="30" y="92" width="500" height="580" rx="10" fill="#121a2c" stroke="#26344d" stroke-width="1.25"/>
  <text x="280" y="122" text-anchor="middle" class="col-t" fill="#60a5fa">Boot Sequence (15 steps)</text>
  <text x="280" y="142" text-anchor="middle" class="col-s">Executed once on power-on reset</text>

  <g font-size="11">
    <rect x="50" y="164" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="176.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="180" text-anchor="middle" class="step-n" fill="#93c5fd">1</text>
    <text x="88" y="181" class="step-f">HAL_Init()</text>
    <text x="320" y="181" class="step-d">SysTick 1ms · NVIC · DBGMCU</text>

    <rect x="50" y="199" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="211.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="215" text-anchor="middle" class="step-n" fill="#93c5fd">2</text>
    <text x="88" y="216" class="step-f">SystemClock_Config()</text>
    <text x="320" y="216" class="step-d">HSI 16MHz → HCLK 8MHz</text>

    <rect x="50" y="234" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="246.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="250" text-anchor="middle" class="step-n" fill="#93c5fd">3</text>
    <text x="88" y="251" class="step-f">MX_GPIO_Init()</text>
    <text x="320" y="251" class="step-d">GPIO A/B/C/D modes + AF</text>

    <rect x="50" y="269" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="281.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="285" text-anchor="middle" class="step-n" fill="#93c5fd">4</text>
    <text x="88" y="286" class="step-f">MX_DMA_Init()</text>
    <text x="320" y="286" class="step-d" fill="#f87171">DMA1_Ch1 · NVIC prio 0 (unused)</text>

    <rect x="50" y="304" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="316.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="320" text-anchor="middle" class="step-n" fill="#93c5fd">5</text>
    <text x="88" y="321" class="step-f">MX_ADC1_Init()</text>
    <text x="320" y="321" class="step-d">12-bit · CH0(PA0) · continuous+DMA</text>

    <rect x="50" y="339" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="351.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="355" text-anchor="middle" class="step-n" fill="#93c5fd">6</text>
    <text x="88" y="356" class="step-f">MX_I2C2_Init()</text>
    <text x="320" y="356" class="step-d">100kHz master · PA11/PA12 OD</text>

    <rect x="50" y="374" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="386.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="390" text-anchor="middle" class="step-n" fill="#93c5fd">7</text>
    <text x="88" y="391" class="step-f">MX_USART2_UART_Init()</text>
    <text x="320" y="391" class="step-d">9600 8N1 · blocking TX</text>

    <rect x="50" y="409" width="460" height="25" rx="5" fill="#0d1a12" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="68" cy="421.5" r="8" fill="#12261a" stroke="#22c55e" stroke-width="1"/><text x="68" y="425" text-anchor="middle" class="step-n" fill="#86efac">8</text>
    <text x="88" y="426" class="step-f">MX_TIM1_Init()</text>
    <text x="320" y="426" class="step-d">PWM 1kHz · ARR=999 PSC=7</text>

    <rect x="50" y="444" width="460" height="25" rx="5" fill="#0d1626" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="68" cy="456.5" r="8" fill="#16233a" stroke="#3b82f6" stroke-width="1"/><text x="68" y="460" text-anchor="middle" class="step-n" fill="#93c5fd">9</text>
    <text x="88" y="461" class="step-f">MX_RTC_Init()</text>
    <text x="320" y="461" class="step-d" fill="#f87171">LSE · 24h · time=00:36 (BUG)</text>

    <rect x="50" y="479" width="460" height="25" rx="5" fill="#160f22" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="68" cy="491.5" r="8.5" fill="#1e1530" stroke="#a855f7" stroke-width="1"/><text x="68" y="495" text-anchor="middle" class="step-n" fill="#c084fc">10</text>
    <text x="88" y="496" class="step-f">ADC Calibration</text>
    <text x="320" y="496" class="step-d">HAL_ADCEx_Calibration_Start</text>

    <rect x="50" y="514" width="460" height="25" rx="5" fill="#160f22" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="68" cy="526.5" r="8.5" fill="#1e1530" stroke="#a855f7" stroke-width="1"/><text x="68" y="530" text-anchor="middle" class="step-n" fill="#c084fc">11</text>
    <text x="88" y="531" class="step-f">Load EEPROM Settings</text>
    <text x="320" y="531" class="step-d">I²C read · boot_count++</text>

    <rect x="50" y="549" width="460" height="25" rx="5" fill="#160f22" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="68" cy="561.5" r="8.5" fill="#1e1530" stroke="#a855f7" stroke-width="1"/><text x="68" y="565" text-anchor="middle" class="step-n" fill="#c084fc">12</text>
    <text x="88" y="566" class="step-f">tm1637_init()</text>
    <text x="320" y="566" class="step-d">OD GPIO · brightness 5 · clear</text>

    <rect x="50" y="584" width="460" height="25" rx="5" fill="#0d1a12" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="68" cy="596.5" r="8.5" fill="#12261a" stroke="#22c55e" stroke-width="1"/><text x="68" y="600" text-anchor="middle" class="step-n" fill="#86efac">13</text>
    <text x="88" y="601" class="step-f">PWM Start (×3)</text>
    <text x="320" y="601" class="step-d">HAL_TIM_PWM_Start CH1/2/3</text>

    <rect x="50" y="619" width="460" height="25" rx="5" fill="#0d1a12" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="68" cy="631.5" r="8.5" fill="#12261a" stroke="#22c55e" stroke-width="1"/><text x="68" y="635" text-anchor="middle" class="step-n" fill="#86efac">14</text>
    <text x="88" y="636" class="step-f">Initial Display</text>
    <text x="320" y="636" class="step-d">TM1637 shows initial time</text>

    <rect x="50" y="654" width="460" height="25" rx="7" fill="#0e5a66" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="68" cy="666.5" r="8.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/><text x="68" y="670" text-anchor="middle" class="step-n" fill="#67e8f9">15</text>
    <text x="88" y="671" font-weight="700" fill="#f0fdff">while(1) — Super Loop</text>
    <text x="320" y="671" font-weight="700" fill="#c7f9ff">Infinite — never returns</text>
  </g>

  <!-- RIGHT: SUPER LOOP -->
  <rect x="560" y="92" width="510" height="580" rx="10" fill="#0b2026" stroke="#26344d" stroke-width="1.25"/>
  <text x="815" y="122" text-anchor="middle" class="col-t" fill="#22d3ee">Super Loop (6 phases, ~6ms total)</text>
  <text x="815" y="142" text-anchor="middle" class="col-s">::FW_SUPERLOOP — repeated every iteration</text>

  <g>
    <rect x="590" y="164" width="450" height="62" rx="6" fill="#0d1626" stroke="#3b82f6" stroke-width="2"/>
    <use href="#i-clock" x="606" y="176" width="14" height="14" color="#93c5fd"/>
    <text x="628" y="188" class="ph-n" fill="#93c5fd">Phase 1</text>
    <text x="628" y="206" class="ph-t">HAL_GetTick() Poll</text>
    <text x="800" y="206" class="ph-s">Read uwTick counter</text>
    <text x="610" y="222" class="ph-m">Timing: &lt;1µs · non-blocking · every loop</text>

    <rect x="590" y="244" width="450" height="62" rx="6" fill="#160f22" stroke="#a855f7" stroke-width="2"/>
    <use href="#i-display" x="606" y="256" width="14" height="14" color="#c084fc"/>
    <text x="628" y="268" class="ph-n" fill="#c084fc">Phase 2</text>
    <text x="628" y="286" class="ph-t">Display Refresh Check</text>
    <text x="800" y="286" class="ph-s">tick−lastUpdate ≥ 1000ms</text>
    <text x="610" y="302" class="ph-m">~5ms if triggered · TM1637 bit-banged write · periodic @1s</text>

    <rect x="590" y="324" width="450" height="62" rx="6" fill="#231314" stroke="#ef4444" stroke-width="2"/>
    <use href="#i-button" x="606" y="336" width="14" height="14" color="#f87171"/>
    <text x="628" y="348" class="ph-n" fill="#f87171">Phase 3</text>
    <text x="628" y="366" class="ph-t">Button Polling</text>
    <text x="800" y="366" class="ph-s">HAL_GPIO_ReadPin ×3</text>
    <text x="610" y="382" class="ph-m">~6µs · 250ms debounce gate · SW1/2/3 active-low</text>

    <rect x="590" y="404" width="450" height="62" rx="6" fill="#211a0d" stroke="#f59e0b" stroke-width="2"/>
    <use href="#i-therm" x="606" y="416" width="14" height="14" color="#fbbf24"/>
    <text x="628" y="428" class="ph-n" fill="#fbbf24">Phase 4</text>
    <text x="628" y="446" class="ph-t">Temperature Processing</text>
    <text x="800" y="446" class="ph-s">Update_Temperature_LED</text>
    <text x="610" y="462" class="ph-m">~10ms · ADC start/poll/stop · Beta eq · SET_COMPARE ×3</text>

    <rect x="590" y="484" width="450" height="62" rx="6" fill="#0d1626" stroke="#3b82f6" stroke-width="2"/>
    <use href="#i-uart" x="606" y="496" width="14" height="14" color="#93c5fd"/>
    <text x="628" y="508" class="ph-n" fill="#93c5fd">Phase 5</text>
    <text x="628" y="526" class="ph-t">UART Handling</text>
    <text x="800" y="526" class="ph-s">Handle_UART_Transmission</text>
    <text x="610" y="542" class="ph-m">~1-4ms if triggered · 9600 baud · periodic @5s (configurable)</text>

    <rect x="590" y="564" width="450" height="62" rx="6" fill="#0d1a12" stroke="#22c55e" stroke-width="2"/>
    <use href="#i-flow" x="606" y="576" width="14" height="14" color="#86efac"/>
    <text x="628" y="588" class="ph-n" fill="#86efac">Phase 6</text>
    <text x="628" y="606" class="ph-t">HAL_Delay(5)</text>
    <text x="800" y="606" class="ph-s">Blocking delay</text>
    <text x="610" y="622" class="ph-m">5ms · SysTick busy-wait · paces iteration to ~6ms</text>
  </g>

  <!-- Loop-back arrow -->
  <path d="M 1040 592 L 1068 592 L 1068 154 L 1045 154" stroke="#22d3ee" stroke-width="2.25" stroke-dasharray="7,4" fill="none" marker-end="url(#arr-lp)"/>
  <text x="1076" y="372" font-size="12" fill="#22d3ee" font-weight="700" transform="rotate(90 1076 372)">repeat ~6ms</text>

  <!-- BOTTOM: TIMING REFERENCE -->
  <rect x="30" y="692" width="1040" height="200" rx="10" fill="#121a2c" stroke="#26344d" stroke-width="1.25"/>
  <text x="550" y="720" text-anchor="middle" class="sec-t">Timing &amp; Clock Reference — ::FW_TIMING</text>

  <rect x="50" y="737" width="480" height="140" rx="8" fill="#0d1420" stroke="#26344d" stroke-width="1.25"/>
  <use href="#i-clock" x="66" y="748" width="13" height="13" color="#22d3ee"/>
  <text x="290" y="760" text-anchor="middle" class="sub-t" fill="#22d3ee">Clock Tree — ::FW_CLOCK_TREE</text>
  <text x="70" y="787" class="ref-t">HSI 16 MHz → AHB ÷2 → HCLK = 8 MHz</text>
  <text x="70" y="809" class="ref-t">├─ APB1: USART2(8MHz→9600), I2C2(8MHz→100kHz)</text>
  <text x="70" y="831" class="ref-t">├─ APB2: TIM1(PSC=7→1MHz→ARR=999→1kHz PWM)</text>
  <text x="70" y="853" class="ref-t">├─ ADC: HSI ÷4 → ~2MHz</text>
  <text x="70" y="870" class="ref-t">└─ LSE: 32.768kHz → async127+sync255 → 1.01Hz</text>

  <rect x="550" y="737" width="500" height="140" rx="8" fill="#0d1420" stroke="#26344d" stroke-width="1.25"/>
  <use href="#i-flow" x="566" y="748" width="13" height="13" color="#fbbf24"/>
  <text x="800" y="760" text-anchor="middle" class="sub-t" fill="#fbbf24">Performance Metrics</text>
  <text x="570" y="787" class="ref-t">Loop pacing: 5ms (HAL_Delay) · Total iteration: ~6ms</text>
  <text x="570" y="809" class="ref-t">Display refresh: every 1000ms (HAL_GetTick delta)</text>
  <text x="570" y="831" class="ref-t">Button debounce: 250ms per button (configurable)</text>
  <text x="570" y="853" class="ref-t">UART report interval: 5s default (1-99s via menu)</text>
  <text x="570" y="870" class="ref-t">ADC sample: 79.5 cycles (~10µs) · PWM: 1kHz</text>

  <text x="1060" y="906" text-anchor="end" class="foot">DIAGRAM 6 / 6 — RUNTIME WORKFLOW</text>
</svg>
