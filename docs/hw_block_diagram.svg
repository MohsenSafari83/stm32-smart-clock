<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="mcu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="periph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="power" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2"/>
      <stop offset="100%" style="stop-color:#fecaca"/>
    </linearGradient>
    <linearGradient id="i2c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7"/>
      <stop offset="100%" style="stop-color:#bbf7d0"/>
    </linearGradient>
    <linearGradient id="uart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#bfdbfe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f1f5f9" rx="8"/>
  <rect x="10" y="10" width="1180" height="880" fill="none" stroke="#cbd5e1" stroke-width="2" rx="6"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">STM32 Smart Clock — Hardware Block Diagram</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#64748b">MCU: STM32G030 (Cortex-M0+, 8 MHz HCLK)</text>

  <!-- === STM32 MCU === -->
  <rect x="440" y="280" width="320" height="320" rx="12" fill="url(#mcu)" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="320" text-anchor="middle" font-size="18" font-weight="bold" fill="#e2e8f0">STM32G030</text>
  <text x="600" y="338" text-anchor="middle" font-size="11" fill="#94a3b8">Cortex-M0+, 8 MHz</text>
  <line x1="460" y1="350" x2="740" y2="350" stroke="#334155" stroke-width="1"/>
  
  <!-- MCU Internal Peripherals -->
  <text x="600" y="370" text-anchor="middle" font-size="11" fill="#60a5fa">Internal Peripherals</text>
  <text x="600" y="390" text-anchor="middle" font-size="10" fill="#94a3b8">ADC1  ─  TIM1 (PWM)  ─  I2C2  ─  USART2</text>
  <text x="600" y="406" text-anchor="middle" font-size="10" fill="#94a3b8">RTC  ─  DMA1_CH1  ─  GPIO (A,B,C,D)</text>
  <text x="600" y="422" text-anchor="middle" font-size="10" fill="#94a3b8">HSI 16 MHz  ─  LSE 32.768 kHz</text>

  <!-- MCU Pin Mapping -->
  <line x1="460" y1="440" x2="740" y2="440" stroke="#334155" stroke-width="1"/>
  <text x="600" y="458" text-anchor="middle" font-size="11" fill="#60a5fa">Pin Mapping</text>
  
  <!-- Left side pins -->
  <text x="460" y="480" text-anchor="end" font-size="9" fill="#cbd5e1">PA0  ── ADC1_IN0 (NTC)</text>
  <text x="460" y="496" text-anchor="end" font-size="9" fill="#cbd5e1">PA2  ── USART2_TX</text>
  <text x="460" y="512" text-anchor="end" font-size="9" fill="#cbd5e1">PA3  ── USART2_RX</text>
  <text x="460" y="528" text-anchor="end" font-size="9" fill="#cbd5e1">PA8  ── TIM1_CH1 (R)</text>
  <text x="460" y="544" text-anchor="end" font-size="9" fill="#cbd5e1">PA9  ── TIM1_CH2 (G)</text>
  
  <!-- Right side pins -->
  <text x="740" y="480" text-anchor="start" font-size="9" fill="#cbd5e1">PA10 ── TIM1_CH3 (B)</text>
  <text x="740" y="496" text-anchor="start" font-size="9" fill="#cbd5e1">PA11 ── I2C2_SCL</text>
  <text x="740" y="512" text-anchor="start" font-size="9" fill="#cbd5e1">PA12 ── I2C2_SDA</text>
  <text x="740" y="528" text-anchor="start" font-size="9" fill="#cbd5e1">PB13 ── SW1 (UP)</text>
  <text x="740" y="544" text-anchor="start" font-size="9" fill="#cbd5e1">PB14 ── SW2 (DOWN)</text>
  <text x="740" y="560" text-anchor="start" font-size="9" fill="#cbd5e1">PB15 ── SW3 (SELECT)</text>

  <!-- Bottom pins -->
  <text x="600" y="582" text-anchor="middle" font-size="9" fill="#cbd5e1">PC6 ── TM1637 DIO  |  PC7 ── TM1637 CLK  |  PB3 ── LED1  |  PD3 ── LED2</text>

  <!-- === PERIPHERALS === -->

  <!-- NTC Thermistor -->
  <rect x="120" y="100" width="160" height="100" rx="8" fill="url(#periph)" stroke="#ea580c" stroke-width="2"/>
  <text x="200" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">NTC Thermistor</text>
  <text x="200" y="148" text-anchor="middle" font-size="10" fill="#64748b">10k @ 25°C, B=3950</text>
  <text x="200" y="164" text-anchor="middle" font-size="10" fill="#64748b">Voltage Divider + R14=10k</text>
  <text x="200" y="180" text-anchor="middle" font-size="10" fill="#64748b">to GND</text>

  <!-- RGB LED -->
  <rect x="120" y="260" width="160" height="100" rx="8" fill="url(#periph)" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">RGB LED</text>
  <text x="200" y="308" text-anchor="middle" font-size="10" fill="#64748b">Common Cathode</text>
  <text x="200" y="324" text-anchor="middle" font-size="10" fill="#64748b">PWM 1 kHz</text>
  <text x="200" y="340" text-anchor="middle" font-size="10" fill="#64748b">R:PA8  G:PA9  B:PA10</text>

  <!-- TM1637 Display -->
  <rect x="120" y="420" width="160" height="100" rx="8" fill="url(#periph)" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">TM1637 Display</text>
  <text x="200" y="468" text-anchor="middle" font-size="10" fill="#64748b">4-Digit 7-Segment</text>
  <text x="200" y="484" text-anchor="middle" font-size="10" fill="#64748b">Bit-banged I2C-like</text>
  <text x="200" y="500" text-anchor="middle" font-size="10" fill="#64748b">DIO:PC6  CLK:PC7</text>

  <!-- Buttons -->
  <rect x="120" y="580" width="160" height="100" rx="8" fill="url(#power)" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="612" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Push Buttons</text>
  <text x="200" y="630" text-anchor="middle" font-size="10" fill="#64748b">SW1 (UP):   PB13</text>
  <text x="200" y="646" text-anchor="middle" font-size="10" fill="#64748b">SW2 (DOWN): PB14</text>
  <text x="200" y="662" text-anchor="middle" font-size="10" fill="#64748b">SW3 (SEL):  PB15</text>
  <text x="200" y="678" text-anchor="middle" font-size="10" fill="#64748b">Active Low, No Pull</text>

  <!-- I2C EEPROM -->
  <rect x="880" y="100" width="180" height="130" rx="8" fill="url(#i2c)" stroke="#16a34a" stroke-width="2"/>
  <text x="970" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">I²C EEPROM</text>
  <text x="970" y="148" text-anchor="middle" font-size="10" fill="#64748b">24Cxx Series</text>
  <text x="970" y="164" text-anchor="middle" font-size="10" fill="#64748b">Addr: 0xA0 (7-bit)</text>
  <text x="970" y="180" text-anchor="middle" font-size="10" fill="#64748b">Stores SystemSettings</text>
  <text x="970" y="196" text-anchor="middle" font-size="10" fill="#64748b">I²C2: PA11(SCL), PA12(SDA)</text>

  <!-- UART / Serial -->
  <rect x="880" y="280" width="180" height="100" rx="8" fill="url(#uart)" stroke="#2563eb" stroke-width="2"/>
  <text x="970" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">UART Serial</text>
  <text x="970" y="328" text-anchor="middle" font-size="10" fill="#64748b">USART2, 9600 baud</text>
  <text x="970" y="344" text-anchor="middle" font-size="10" fill="#64748b">8N1, TX/RX</text>
  <text x="970" y="360" text-anchor="middle" font-size="10" fill="#64748b">TX:PA2  RX:PA3</text>

  <!-- Indicator LEDs -->
  <rect x="880" y="440" width="180" height="100" rx="8" fill="url(#periph)" stroke="#ca8a04" stroke-width="2"/>
  <text x="970" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Indicator LEDs</text>
  <text x="970" y="488" text-anchor="middle" font-size="10" fill="#64748b">LED1 (UART Activity): PB3</text>
  <text x="970" y="504" text-anchor="middle" font-size="10" fill="#64748b">LED2 (Menu Active):  PD3</text>
  <text x="970" y="520" text-anchor="middle" font-size="10" fill="#64748b">Active High, PP Output</text>

  <!-- RTC Crystal -->
  <rect x="880" y="600" width="180" height="80" rx="8" fill="url(#periph)" stroke="#0891b2" stroke-width="2"/>
  <text x="970" y="628" text-anchor="middle" font-size="13" font-weight="bold" fill="#155e75">LSE Crystal</text>
  <text x="970" y="646" text-anchor="middle" font-size="10" fill="#64748b">32.768 kHz</text>
  <text x="970" y="662" text-anchor="middle" font-size="10" fill="#64748b">RTC Timekeeping</text>

  <!-- Power Supply -->
  <rect x="880" y="740" width="180" height="70" rx="8" fill="url(#power)" stroke="#dc2626" stroke-width="2"/>
  <text x="970" y="766" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Power Supply</text>
  <text x="970" y="784" text-anchor="middle" font-size="10" fill="#64748b">3.3 V VDD</text>

  <!-- === CONNECTIONS === -->

  <!-- NTC → ADC -->
  <path d="M 280 140 L 440 340" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
  <rect x="310" y="200" width="100" height="22" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="360" y="215" text-anchor="middle" font-size="9" fill="#9a3412">Analog (PA0)</text>

  <!-- RGB LED ← PWM -->
  <path d="M 440 380 L 280 310" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="310" y="330" width="110" height="22" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="365" y="345" text-anchor="middle" font-size="9" fill="#166534">PWM PA8/9/10</text>

  <!-- TM1637 ← GPIO -->
  <path d="M 440 480 L 280 470" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="310" y="455" width="110" height="22" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="365" y="470" text-anchor="middle" font-size="9" fill="#5b21b6">GPIO PC6/PC7</text>

  <!-- Buttons → GPIO -->
  <path d="M 280 630 L 440 550" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="310" y="580" width="110" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="365" y="595" text-anchor="middle" font-size="9" fill="#991b1b">GPIO PB13/14/15</text>

  <!-- EEPROM ← I2C -->
  <path d="M 760 165 L 880 165" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="810" y="148" width="60" height="20" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="840" y="162" text-anchor="middle" font-size="9" fill="#166534">I²C</text>

  <!-- UART ← USART -->
  <path d="M 760 330 L 880 330" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="810" y="315" width="60" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="840" y="329" text-anchor="middle" font-size="9" fill="#1e40af">UART</text>

  <!-- Indicator LEDs ← GPIO -->
  <path d="M 760 490 L 880 490" fill="none" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="810" y="475" width="60" height="20" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="840" y="489" text-anchor="middle" font-size="9" fill="#854d0e">GPIO</text>

  <!-- RTC ← LSE -->
  <path d="M 760 620 L 880 620" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="810" y="608" width="60" height="20" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
  <text x="840" y="622" text-anchor="middle" font-size="9" fill="#155e75">LSE</text>

  <!-- Legend -->
  <rect x="40" y="740" width="300" height="130" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="55" y="762" font-size="12" font-weight="bold" fill="#1e293b">Legend</text>
  <line x1="55" y1="780" x2="100" y2="780" stroke="#ea580c" stroke-width="2.5"/>
  <text x="105" y="784" font-size="10" fill="#475569">Analog / ADC</text>
  <line x1="55" y1="798" x2="100" y2="798" stroke="#16a34a" stroke-width="2.5"/>
  <text x="105" y="802" font-size="10" fill="#475569">PWM / I²C</text>
  <line x1="55" y1="816" x2="100" y2="816" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="105" y="820" font-size="10" fill="#475569">GPIO (Bit-banged)</text>
  <line x1="55" y1="834" x2="100" y2="834" stroke="#2563eb" stroke-width="2.5"/>
  <text x="105" y="838" font-size="10" fill="#475569">UART</text>
  <line x1="55" y1="852" x2="100" y2="852" stroke="#dc2626" stroke-width="2.5"/>
  <text x="105" y="856" font-size="10" fill="#475569">Digital Input</text>

  <!-- Doc info -->
  <text x="1000" y="870" text-anchor="end" font-size="9" fill="#94a3b8">Rev 1.0 — Generated from firmware analysis</text>
</svg>