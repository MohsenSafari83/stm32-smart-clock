<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" font-family="Consolas, monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="950" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="1180" height="930" fill="none" stroke="#cbd5e1" stroke-width="2" rx="6"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Data Flow Analysis</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#64748b">Three primary data flows: Temperature Measurement, User Interaction, Settings Persistence</text>

  <!-- ============================================ -->
  <!-- FLOW 1: TEMPERATURE MEASUREMENT -->
  <!-- ============================================ -->
  <rect x="30" y="80" width="1140" height="240" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="50" y="105" font-size="14" font-weight="bold" fill="#9a3412">Flow 1: Temperature → RGB LED</text>
  <text x="50" y="120" font-size="10" fill="#ea580c">Update_Temperature_LED() — Called every main-loop iteration (~200 Hz)</text>

  <!-- NTC -->
  <rect x="60" y="145" width="140" height="60" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="130" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">NTC Thermistor</text>
  <text x="130" y="183" text-anchor="middle" font-size="9" fill="#78350f">10k, B=3950</text>
  <text x="130" y="196" text-anchor="middle" font-size="9" fill="#78350f">Voltage divider</text>

  <!-- Arrow -->
  <line x1="200" y1="175" x2="260" y2="175" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="230" y="168" text-anchor="middle" font-size="8" fill="#ea580c">Analog</text>

  <!-- ADC1 -->
  <rect x="260" y="145" width="140" height="60" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="330" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">ADC1 (PA0)</text>
  <text x="330" y="180" text-anchor="middle" font-size="9" fill="#78350f">12-bit, 0-4095</text>
  <text x="330" y="195" text-anchor="middle" font-size="9" fill="#78350f">Vref=3.3V</text>

  <!-- Arrow -->
  <line x1="400" y1="175" x2="460" y2="175" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="430" y="168" text-anchor="middle" font-size="8" fill="#ea580c">raw</text>

  <!-- Conversion -->
  <rect x="460" y="140" width="180" height="70" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="550" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a3412">Beta Equation (float)</text>
  <text x="550" y="175" text-anchor="middle" font-size="9" fill="#78350f">v_out = adc × 3.3 / 4095</text>
  <text x="550" y="190" text-anchor="middle" font-size="9" fill="#78350f">r_ntc = 10k × v_out/(3.3-v_out)</text>
  <text x="550" y="205" text-anchor="middle" font-size="9" fill="#78350f">T = 1/(1/298.15 + ln(r/10k)/3950) - 273.15</text>

  <!-- Arrow -->
  <line x1="640" y1="175" x2="700" y2="175" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="670" y="168" text-anchor="middle" font-size="8" fill="#ea580c">temp_c</text>

  <!-- PWM Map -->
  <rect x="700" y="145" width="160" height="60" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="780" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a3412">PWM Mapping</text>
  <text x="780" y="180" text-anchor="middle" font-size="9" fill="#78350f">20°C → 0, 100°C → 999</text>
  <text x="780" y="195" text-anchor="middle" font-size="9" fill="#78350f">NO CLAMPING (bug)</text>

  <!-- Arrow -->
  <line x1="860" y1="175" x2="920" y2="175" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="890" y="168" text-anchor="middle" font-size="8" fill="#ea580c">pwm</text>

  <!-- RGB LED -->
  <rect x="920" y="145" width="140" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="990" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">RGB LED</text>
  <text x="990" y="180" text-anchor="middle" font-size="9" fill="#7f1d1d">TIM1 CH1/2/3</text>
  <text x="990" y="195" text-anchor="middle" font-size="9" fill="#7f1d1d">1 kHz PWM</text>

  <!-- Issue callouts -->
  <text x="60" y="245" font-size="10" font-weight="bold" fill="#dc2626">Issues:</text>
  <text x="60" y="260" font-size="9" fill="#dc2626">• logf() on Cortex-M0+ (no FPU) — thousands of cycles per call</text>
  <text x="60" y="275" font-size="9" fill="#dc2626">• Called 200 Hz for a sensor that changes at &lt; 1 Hz</text>
  <text x="60" y="290" font-size="9" fill="#dc2626">• PWM output unclamped — negative temps produce full brightness</text>
  <text x="60" y="305" font-size="9" fill="#dc2626">• All 3 channels cleared to 0 before setting 1 channel — visible flicker</text>

  <!-- ============================================ -->
  <!-- FLOW 2: USER INTERACTION -->
  <!-- ============================================ -->
  <rect x="30" y="340" width="1140" height="260" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="365" font-size="14" font-weight="bold" fill="#1e40af">Flow 2: User Interaction → Menu FSM → Display/Output</text>
  <text x="50" y="380" font-size="10" fill="#2563eb">Button Press → Debounce → FSM Transition → Action → Display Update</text>

  <!-- Button -->
  <rect x="60" y="405" width="120" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Button Press</text>
  <text x="120" y="443" text-anchor="middle" font-size="9" fill="#1e3a5f">SW1/SW2/SW3</text>
  <text x="120" y="458" text-anchor="middle" font-size="9" fill="#1e3a5f">Active Low</text>

  <!-- Arrow -->
  <line x1="180" y1="435" x2="230" y2="435" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="205" y="428" text-anchor="middle" font-size="8" fill="#2563eb">GPIO</text>

  <!-- Debounce -->
  <rect x="230" y="405" width="130" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="295" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Debounce</text>
  <text x="295" y="440" text-anchor="middle" font-size="9" fill="#1e3a5f">250 ms cooldown</text>
  <text x="295" y="455" text-anchor="middle" font-size="9" fill="#1e3a5f">Per-press, not per-edge</text>

  <!-- Arrow -->
  <line x1="360" y1="435" x2="410" y2="435" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="385" y="428" text-anchor="middle" font-size="8" fill="#2563eb">id</text>

  <!-- FSM -->
  <rect x="410" y="395" width="200" height="80" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="510" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Execute_Button_Action()</text>
  <text x="510" y="435" text-anchor="middle" font-size="9" fill="#1e3a5f">FSM switch(current_state)</text>
  <text x="510" y="450" text-anchor="middle" font-size="9" fill="#1e3a5f">Updates state + menu_index</text>
  <text x="510" y="465" text-anchor="middle" font-size="9" fill="#1e3a5f">Calls Refresh_Display_Output()</text>

  <!-- Arrow down -->
  <line x1="510" y1="475" x2="510" y2="510" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Action box -->
  <rect x="380" y="510" width="260" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="510" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Actions</text>
  <text x="510" y="547" text-anchor="middle" font-size="9" fill="#1e3a5f">• Modify settings.display_en / led_color / uart_*</text>
  <text x="510" y="562" text-anchor="middle" font-size="9" fill="#1e3a5f">• Set RTC time</text>
  <text x="510" y="575" text-anchor="middle" font-size="9" fill="#1e3a5f">• Save_Settings_To_EEPROM()</text>

  <!-- Arrow to display -->
  <line x1="640" y1="435" x2="700" y2="435" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Display Update -->
  <rect x="700" y="405" width="180" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="790" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Display Update</text>
  <text x="790" y="443" text-anchor="middle" font-size="9" fill="#1e3a5f">snprintf→tm1637_write</text>
  <text x="790" y="458" text-anchor="middle" font-size="9" fill="#1e3a5f">RTC read → format</text>

  <!-- Arrow to RTC -->
  <line x1="790" y1="405" x2="790" y2="370" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <text x="800" y="382" font-size="8" fill="#2563eb">reads</text>

  <!-- RTC -->
  <rect x="730" y="340" width="120" height="30" rx="4" fill="#e0f2fe" stroke="#2563eb" stroke-width="1"/>
  <text x="790" y="358" text-anchor="middle" font-size="9" fill="#1e40af">RTC (I²C)</text>

  <!-- Arrow to EEPROM (rare) -->
  <line x1="640" y1="545" x2="700" y2="545" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <text x="670" y="538" text-anchor="middle" font-size="8" fill="#2563eb">save</text>

  <rect x="700" y="530" width="120" height="30" rx="4" fill="#e0f2fe" stroke="#2563eb" stroke-width="1"/>
  <text x="760" y="548" text-anchor="middle" font-size="9" fill="#1e40af">EEPROM (I²C)</text>

  <!-- Issue callouts -->
  <text x="60" y="545" font-size="10" font-weight="bold" fill="#dc2626">Issues:</text>
  <text x="60" y="560" font-size="9" fill="#dc2626">• 250 ms debounce makes UI feel sluggish</text>
  <text x="60" y="575" font-size="9" fill="#dc2626">• Active polling wastes CPU — no interrupt-driven button input</text>
  <text x="60" y="590" font-size="9" fill="#dc2626">• EEPROM written on every settings change, even if value unchanged</text>

  <!-- ============================================ -->
  <!-- FLOW 3: SETTINGS PERSISTENCE -->
  <!-- ============================================ -->
  <rect x="30" y="620" width="1140" height="210" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="645" font-size="14" font-weight="bold" fill="#166534">Flow 3: Settings Persistence (EEPROM)</text>
  <text x="50" y="660" font-size="10" fill="#16a34a">Boot → Load → Runtime Modify → Save</text>

  <!-- Boot -->
  <rect x="60" y="685" width="140" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="705" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">System Boot</text>
  <text x="130" y="720" text-anchor="middle" font-size="9" fill="#14532d">main() starts</text>

  <!-- Arrow -->
  <line x1="200" y1="712" x2="250" y2="712" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Load -->
  <rect x="250" y="685" width="160" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="705" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Load_Settings()</text>
  <text x="330" y="720" text-anchor="middle" font-size="9" fill="#14532d">I2C Mem_Read (100ms timeout)</text>

  <!-- Arrow -->
  <line x1="410" y1="712" x2="460" y2="712" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Struct -->
  <rect x="460" y="685" width="160" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="703" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">SystemSettings</text>
  <text x="540" y="718" text-anchor="middle" font-size="9" fill="#14532d">display_en, led_color</text>
  <text x="540" y="733" text-anchor="middle" font-size="9" fill="#14532d">uart_en, uart_interval, boot_count</text>

  <!-- Branch -->
  <line x1="620" y1="712" x2="680" y2="712" stroke="#16a34a" stroke-width="2"/>
  <line x1="680" y1="712" x2="680" y2="750" stroke="#16a34a" stroke-width="2"/>
  <line x1="680" y1="712" x2="680" y2="740" stroke="#16a34a" stroke-width="2"/>

  <!-- Runtime modify -->
  <rect x="560" y="755" width="240" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="777" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Runtime Modification (Menu FSM)</text>
  <text x="680" y="794" text-anchor="middle" font-size="9" fill="#14532d">User changes via menu → Update struct fields</text>

  <!-- Save -->
  <rect x="250" y="755" width="200" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="775" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Save_Settings_To_EEPROM()</text>
  <text x="350" y="792" text-anchor="middle" font-size="9" fill="#14532d">I2C Mem_Write + HAL_Delay(10)</text>

  <line x1="560" y1="780" x2="450" y2="780" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- EEPROM box -->
  <rect x="920" y="685" width="140" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="705" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">EEPROM</text>
  <text x="990" y="720" text-anchor="middle" font-size="9" fill="#14532d">I²C, Addr 0xA0</text>

  <line x1="460" y1="712" x2="920" y2="712" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Issue callouts -->
  <text x="60" y="800" font-size="10" font-weight="bold" fill="#dc2626">Issues:</text>
  <text x="60" y="815" font-size="9" fill="#dc2626">• boot_count increments every boot causing EEPROM write every power cycle</text>
  <text x="60" y="830" font-size="9" fill="#dc2626">• No magic number / version / CRC — corrupted EEPROM detected only by HAL error</text>

  <!-- Doc info -->
  <text x="1050" y="930" text-anchor="end" font-size="9" fill="#94a3b8">Rev 1.0</text>
</svg>