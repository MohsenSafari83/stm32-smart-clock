<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="1080" height="880" fill="none" stroke="#cbd5e1" stroke-width="2" rx="6"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Finite State Machine — User Interface Menu System</text>
  <text x="550" y="58" text-anchor="middle" font-size="11" fill="#64748b">Button-triggered hierarchical menu with persistent settings</text>

  <!-- === STATE NORMAL (idle/clock) === -->
  <rect x="380" y="100" width="240" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">STATE_NORMAL</text>
  <text x="500" y="146" text-anchor="middle" font-size="10" fill="#166534">Display: HH:MM (or blank)</text>
  <text x="500" y="162" text-anchor="middle" font-size="10" fill="#166534">PWM LED active, UART polling</text>
  <text x="500" y="176" text-anchor="middle" font-size="9" fill="#4ade80">← DEFAULT / IDLE →</text>

  <!-- SEL(3) from NORMAL to MAIN_MENU -->
  <path d="M 500 180 L 500 260" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="395" y="205" width="210" height="22" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="500" y="220" text-anchor="middle" font-size="10" fill="#166534">SEL(3) pressed</text>

  <!-- === STATE_MAIN_MENU === -->
  <rect x="340" y="260" width="320" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="500" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">STATE_MAIN_MENU</text>
  <text x="500" y="303" text-anchor="middle" font-size="10" fill="#92400e">menu_index: 0=SETN, 1=DISP, 2=COLR, 3=INTV, 4=UART</text>
  <text x="500" y="319" text-anchor="middle" font-size="10" fill="#92400e">UP(1) → menu_index-- (wrap)</text>
  <text x="500" y="335" text-anchor="middle" font-size="10" fill="#92400e">DOWN(2) → menu_index++ (wrap)</text>
  <text x="500" y="351" text-anchor="middle" font-size="10" fill="#92400e">SEL(3) → enter sub-menu at menu_index</text>

  <!-- Arrow from MENU back to NORMAL (implicit - after sub-menu save) -->
  <!-- Actually let me add an explicit "SEL on exit" back from each sub-state -->

  <!-- === SUB STATES === -->

  <!-- SET_TIME_H -->
  <rect x="40" y="440" width="220" height="90" rx="10" fill="#e0f2fe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">STATE_SUB_SET_TIME_H</text>
  <text x="150" y="483" text-anchor="middle" font-size="9" fill="#1e40af">Display: "H.XX"</text>
  <text x="150" y="498" text-anchor="middle" font-size="9" fill="#1e40af">UP(1) → hour++ (wrap 0-23)</text>
  <text x="150" y="513" text-anchor="middle" font-size="9" fill="#1e40af">DOWN(2) → hour-- (wrap)</text>
  <text x="150" y="525" text-anchor="middle" font-size="9" fill="#1e40af">SEL(3) → SET_TIME_M</text>

  <!-- SET_TIME_M -->
  <rect x="310" y="440" width="220" height="90" rx="10" fill="#e0f2fe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="420" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">STATE_SUB_SET_TIME_M</text>
  <text x="420" y="483" text-anchor="middle" font-size="9" fill="#1e40af">Display: "M.XX"</text>
  <text x="420" y="498" text-anchor="middle" font-size="9" fill="#1e40af">UP(1) → min++ (wrap 0-59)</text>
  <text x="420" y="513" text-anchor="middle" font-size="9" fill="#1e40af">DOWN(2) → min-- (wrap)</text>
  <text x="420" y="525" text-anchor="middle" font-size="9" fill="#1e40af">SEL(3) → Set RTC → NORMAL</text>

  <!-- TOGGLE_DISPLAY -->
  <rect x="580" y="440" width="220" height="90" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="690" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">STATE_SUB_TOGGLE_DISPLAY</text>
  <text x="690" y="483" text-anchor="middle" font-size="9" fill="#9d174d">Display: "D.ON" / "D.OFF"</text>
  <text x="690" y="498" text-anchor="middle" font-size="9" fill="#9d174d">UP(1)/DOWN(2) → toggle</text>
  <text x="690" y="513" text-anchor="middle" font-size="9" fill="#9d174d">settings.display_en ^= 1</text>
  <text x="690" y="525" text-anchor="middle" font-size="9" fill="#9d174d">SEL(3) → Save → NORMAL</text>

  <!-- SET_COLOR -->
  <rect x="40" y="600" width="220" height="90" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="150" y="625" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">STATE_SUB_SET_COLOR</text>
  <text x="150" y="643" text-anchor="middle" font-size="9" fill="#6b21a8">Display: "GREN"/"RED"/"BLU"</text>
  <text x="150" y="658" text-anchor="middle" font-size="9" fill="#6b21a8">UP(1) → led_color++ (0→1→2→0)</text>
  <text x="150" y="673" text-anchor="middle" font-size="9" fill="#6b21a8">DOWN(2) → led_color-- (wrap)</text>
  <text x="150" y="685" text-anchor="middle" font-size="9" fill="#6b21a8">SEL(3) → Save → NORMAL</text>

  <!-- UART_INTERVAL -->
  <rect x="310" y="600" width="220" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="420" y="625" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">STATE_SUB_UART_INTERVAL</text>
  <text x="420" y="643" text-anchor="middle" font-size="9" fill="#92400e">Display: "U.XX"</text>
  <text x="420" y="658" text-anchor="middle" font-size="9" fill="#92400e">UP(1) → interval++ (1-99)</text>
  <text x="420" y="673" text-anchor="middle" font-size="9" fill="#92400e">DOWN(2) → interval-- (wrap)</text>
  <text x="420" y="685" text-anchor="middle" font-size="9" fill="#92400e">SEL(3) → Save → NORMAL</text>

  <!-- UART_TOGGLE -->
  <rect x="580" y="600" width="220" height="90" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="690" y="625" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">STATE_SUB_UART_TOGGLE</text>
  <text x="690" y="643" text-anchor="middle" font-size="9" fill="#9d174d">Display: "U.ON" / "U.OFF"</text>
  <text x="690" y="658" text-anchor="middle" font-size="9" fill="#9d174d">UP(1)/DOWN(2) → toggle</text>
  <text x="690" y="673" text-anchor="middle" font-size="9" fill="#9d174d">settings.uart_en ^= 1</text>
  <text x="690" y="685" text-anchor="middle" font-size="9" fill="#9d174d">SEL(3) → Save → NORMAL</text>

  <!-- === TRANSITIONS === -->

  <!-- MAIN_MENU → SUB_SET_TIME_H (menu_index==0, SEL) -->
  <path d="M 400 360 L 250 440" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="280" y="390" width="120" height="18" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="340" y="403" text-anchor="middle" font-size="8" fill="#1e40af">SEL @ idx=0</text>

  <!-- MAIN_MENU → SUB_TOGGLE_DISPLAY (menu_index==1, SEL) -->
  <path d="M 570 360 L 640 440" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="395" width="100" height="18" rx="3" fill="#fdf2f8" stroke="#db2777" stroke-width="1"/>
  <text x="640" y="408" text-anchor="middle" font-size="8" fill="#9d174d">SEL @ idx=1</text>

  <!-- MAIN_MENU → SUB_SET_COLOR (menu_index==2, SEL) -->
  <path d="M 380 360 L 230 520" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230 520 L 150 600" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="520" width="100" height="18" rx="3" fill="#faf5ff" stroke="#9333ea" stroke-width="1"/>
  <text x="290" y="533" text-anchor="middle" font-size="8" fill="#6b21a8">SEL @ idx=2</text>

  <!-- MAIN_MENU → SUB_UART_INTERVAL (menu_index==3, SEL) -->
  <path d="M 500 360 L 420 510" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 420 510 L 420 600" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="510" width="100" height="18" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="480" y="523" text-anchor="middle" font-size="8" fill="#92400e">SEL @ idx=3</text>

  <!-- MAIN_MENU → SUB_UART_TOGGLE (menu_index==4, SEL) -->
  <path d="M 620 360 L 690 510" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 690 510 L 690 600" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="510" width="100" height="18" rx="3" fill="#fdf2f8" stroke="#db2777" stroke-width="1"/>
  <text x="670" y="523" text-anchor="middle" font-size="8" fill="#9d174d">SEL @ idx=4</text>

  <!-- SUB_SET_TIME_H → SUB_SET_TIME_M (SEL) -->
  <path d="M 260 485 L 310 485" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="265" y="470" width="50" height="15" rx="3" fill="#eff6ff"/>
  <text x="290" y="481" text-anchor="middle" font-size="8" fill="#1e40af">SEL</text>

  <!-- SUB_* → NORMAL -->
  <!-- SET_TIME_M → NORMAL -->
  <path d="M 420 530 L 500 195" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <rect x="425" y="355" width="100" height="18" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="475" y="368" text-anchor="middle" font-size="8" fill="#166534">SEL (save+exit)</text>

  <!-- TOGGLE_DISPLAY → NORMAL -->
  <path d="M 690 530 L 530 195" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- SET_COLOR → NORMAL -->
  <path d="M 150 600 L 150 500 L 470 195" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  
  <!-- UART_INTERVAL → NORMAL -->
  <path d="M 420 690 L 510 195" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- UART_TOGGLE → NORMAL -->
  <path d="M 690 690 L 530 195" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- === LEGEND === -->
  <rect x="850" y="100" width="220" height="200" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="960" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Legend</text>
  <rect x="865" y="135" width="30" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="905" y="149" font-size="10" fill="#475569">Idle / Clock Display</text>
  <rect x="865" y="160" width="30" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="905" y="174" font-size="10" fill="#475569">Menu Navigation</text>
  <rect x="865" y="185" width="30" height="16" rx="3" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="905" y="199" font-size="10" fill="#475569">Time Setting</text>
  <rect x="865" y="210" width="30" height="16" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="905" y="224" font-size="10" fill="#475569">Toggle Menu</text>
  <rect x="865" y="235" width="30" height="16" rx="3" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="905" y="249" font-size="10" fill="#475569">Color Selection</text>

  <!-- Event Key -->
  <line x1="865" y1="268" x2="895" y2="268" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="905" y="272" font-size="10" fill="#475569">SEL(3) → confirm/navigate</text>
  <line x1="865" y1="285" x2="895" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="289" font-size="10" fill="#475569">UP(1) / DOWN(2) → adjust</text>

  <!-- Actions box -->
  <rect x="850" y="315" width="220" height="100" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="960" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Side Effects</text>
  <text x="865" y="358" font-size="9" fill="#475569">• Save_Settings_To_EEPROM() called</text>
  <text x="880" y="374" font-size="9" fill="#475569">on SEL exit from DISP/COLR/INTV/UART</text>
  <text x="865" y="393" font-size="9" fill="#475569">• RTC time updated on SET_TIME_M exit</text>
  <text x="865" y="410" font-size="9" fill="#475569">• Display refreshes after every action</text>

  <!-- Doc info -->
  <text x="1050" y="870" text-anchor="end" font-size="9" fill="#94a3b8">Rev 1.0 — Reverse-engineered from main.c</text>
</svg>