<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Consolas, monospace" font-size="11">
  <defs>
    <pattern id="timing" width="60" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="60" y2="4" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="1180" height="880" fill="none" stroke="#cbd5e1" stroke-width="2" rx="6"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Timing Analysis — Main Loop Execution</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#64748b">All times approximate. MCU: STM32G030 @ 8 MHz. No RTOS, bare-metal super-loop.</text>

  <!-- === TIME SCALE === -->
  <rect x="50" y="80" width="1100" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Timeline (not to scale — single main-loop iteration ~8-15 ms)</text>
  
  <!-- Loop iteration blocks -->
  <!-- Iteration overlay -->
  <rect x="50" y="120" width="1100" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="65" y="145" font-size="10" fill="#475569">1 main-loop iteration (~8-15 ms)</text>

  <!-- === TIMING ROWS === -->

  <!-- Row template: label + active bar -->
  
  <!-- Row 1: HAL_Delay(5) -->
  <text x="65" y="190" font-size="11" fill="#1e293b" font-weight="bold">HAL_Delay(5)</text>
  <text x="65" y="202" font-size="9" fill="#64748b">Wait 5 ms</text>
  <rect x="200" y="180" width="500" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="193" text-anchor="middle" font-size="9" fill="#92400e">5 ms busy-wait (while(VTick) spin)</text>
  <!-- variable part -->
  <rect x="700" y="180" width="450" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" fill-opacity="0.5"/>
  <text x="930" y="193" text-anchor="middle" font-size="9" fill="#92400e">5 ms (SysTick polling)</text>

  <!-- Row 2: Button Polling -->
  <text x="65" y="240" font-size="11" fill="#1e293b" font-weight="bold">Button Polling</text>
  <text x="65" y="252" font-size="9" fill="#64748b">~5 μs</text>
  <rect x="200" y="230" width="80" height="16" rx="3" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="243" text-anchor="middle" font-size="9" fill="#1e40af">3 reads</text>

  <!-- Row 3: Display Refresh -->
  <text x="65" y="290" font-size="11" fill="#1e293b" font-weight="bold">Refresh_Display_Output()</text>
  <text x="65" y="302" font-size="9" fill="#64748b">~1-10 ms</text>
  <rect x="200" y="280" width="120" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="293" text-anchor="middle" font-size="9" fill="#166534">1s interval</text>
  <!-- note: only if 1s elapsed -->
  <rect x="320" y="280" width="480" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1" fill-opacity="0.3" stroke-dasharray="3,2"/>
  <text x="560" y="293" text-anchor="middle" font-size="9" fill="#166534">skipped (not 1s yet)</text>
  
  <text x="400" y="312" text-anchor="middle" font-size="8" fill="#94a3b8">└─ RTC read (I2C) ~3ms ─ TM1637 write ~2ms ─┘</text>

  <!-- Row 4: Temperature Reading -->
  <text x="65" y="350" font-size="11" fill="#1e293b" font-weight="bold">Update_Temperature_LED()</text>
  <text x="65" y="362" font-size="9" fill="#64748b">~5-20 ms</text>
  <rect x="200" y="340" width="120" height="16" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="260" y="353" text-anchor="middle" font-size="9" fill="#9d174d">ADC start</text>
  <rect x="320" y="340" width="180" height="16" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="410" y="353" text-anchor="middle" font-size="9" fill="#9d174d">PollForConversion (~13 μs)</text>
  <rect x="500" y="340" width="100" height="16" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="550" y="353" text-anchor="middle" font-size="9" fill="#9d174d">logf() ~1ms</text>
  <rect x="600" y="340" width="100" height="16" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="650" y="353" text-anchor="middle" font-size="9" fill="#9d174d">PWM set</text>

  <text x="400" y="377" text-anchor="middle" font-size="8" fill="#94a3b8">Runs EVERY loop iteration (~200 Hz). logf() on M0+ with no FPU is VERY expensive.</text>

  <!-- Row 5: UART Transmission -->
  <text x="65" y="410" font-size="11" fill="#1e293b" font-weight="bold">Handle_UART_Transmission()</text>
  <text x="65" y="422" font-size="9" fill="#64748b">~10-80 ms</text>
  <rect x="200" y="400" width="300" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" fill-opacity="0.3" stroke-dasharray="3,2"/>
  <text x="350" y="413" text-anchor="middle" font-size="9" fill="#1e40af" fill-opacity="0.5">skipped (not interval yet)</text>

  <!-- Active UART tx -->
  <rect x="200" y="420" width="100" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="433" text-anchor="middle" font-size="9" fill="#1e40af">RTC read</text>
  <rect x="300" y="420" width="100" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="433" text-anchor="middle" font-size="9" fill="#1e40af">snprintf</text>
  <rect x="400" y="420" width="140" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="433" text-anchor="middle" font-size="9" fill="#1e40af">UART TX @9600 (~8ms)</text>
  <rect x="540" y="420" width="80" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="433" text-anchor="middle" font-size="9" fill="#1e40af">HAL_Delay(5)</text>

  <text x="400" y="455" text-anchor="middle" font-size="8" fill="#94a3b8">└─ When active: ~8 ms for 80 chars @ 9600 baud ─ 5 ms delay ─ GPIO toggle ─┘</text>

  <!-- Row 6: EEPROM Access (rare) -->
  <text x="65" y="490" font-size="11" fill="#1e293b" font-weight="bold">EEPROM Write (on save)</text>
  <text x="65" y="502" font-size="9" fill="#64748b">~15 ms</text>
  <rect x="200" y="480" width="200" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="493" text-anchor="middle" font-size="9" fill="#166534">I2C Mem_Write (5ms)</text>
  <rect x="400" y="480" width="100" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="493" text-anchor="middle" font-size="9" fill="#166534">HAL_Delay(10)</text>

  <!-- Summary bars -->
  <rect x="50" y="530" width="1100" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="65" y="552" font-size="11" font-weight="bold" fill="#1e293b">Scheduling Analysis</text>
  <text x="65" y="570" font-size="9" fill="#475569">• No preemptive scheduling. All tasks run sequentially in main loop order.</text>
  <text x="65" y="585" font-size="9" fill="#475569">• Worst-case loop time: ~20-85 ms (when UART + display + ADC all fire simultaneously).</text>
  <text x="65" y="600" font-size="9" fill="#475569">• Blocking calls (HAL_Delay, PollForConversion, UART_Transmit) prevent any other task from running.</text>

  <!-- === INTERRUPT TIMING === -->
  <text x="600" y="640" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Interrupt Usage</text>
  
  <rect x="50" y="655" width="1100" height="80" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <text x="65" y="675" font-size="11" font-weight="bold" fill="#1e293b">SysTick (only active interrupt)</text>
  <text x="65" y="693" font-size="9" fill="#475569">Priority: 3  |  Rate: 1 kHz (1 ms)  |  Handler: HAL_IncTick()  |  Purpose: HAL_GetTick() timebase</text>
  <text x="65" y="710" font-size="9" fill="#64748b">Note: This is the ONLY interrupt actually used for application timing. No timer interrupts for periodic tasks.</text>
  <text x="65" y="728" font-size="9" fill="#64748b">DMA1_Channel1_IRQHandler is configured but unused (ADC is polled, not DMA-driven).</text>

  <!-- === TIMING CONSTANTS TABLE === -->
  <text x="600" y="765" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Timing Constants Summary</text>

  <rect x="50" y="775" width="1100" height="105" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="65" y="780" width="200" height="22" rx="2" fill="#1e293b"/>
  <text x="165" y="795" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Parameter</text>
  <rect x="265" y="780" width="120" height="22" rx="2" fill="#1e293b"/>
  <text x="325" y="795" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Value</text>
  <rect x="385" y="780" width="180" height="22" rx="2" fill="#1e293b"/>
  <text x="475" y="795" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Location</text>
  <rect x="565" y="780" width="300" height="22" rx="2" fill="#1e293b"/>
  <text x="715" y="795" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Notes</text>

  <!-- Row 1 -->
  <text x="75" y="817" font-size="9" fill="#1e293b">Main loop delay</text>
  <text x="325" y="817" text-anchor="middle" font-size="9" fill="#475569">5 ms</text>
  <text x="475" y="817" text-anchor="middle" font-size="9" fill="#475569">main.c:405</text>
  <text x="575" y="817" font-size="9" fill="#64748b">HAL_Delay(5) at end of every loop</text>
  
  <!-- Row 2 -->
  <text x="75" y="834" font-size="9" fill="#1e293b">ADC sampling interval</text>
  <text x="325" y="834" text-anchor="middle" font-size="9" fill="#475569">~5 ms</text>
  <text x="475" y="834" text-anchor="middle" font-size="9" fill="#475569">main.c:402</text>
  <text x="575" y="834" font-size="9" fill="#64748b">Every loop iteration (200 Hz!)</text>

  <!-- Row 3 -->
  <text x="75" y="851" font-size="9" fill="#1e293b">Display refresh</text>
  <text x="325" y="851" text-anchor="middle" font-size="9" fill="#475569">1 s</text>
  <text x="475" y="851" text-anchor="middle" font-size="9" fill="#475569">main.c:385</text>
  <text x="575" y="851" font-size="9" fill="#64748b">HAL_GetTick() delta</text>

  <!-- Row 4 -->
  <text x="75" y="868" font-size="9" fill="#1e293b">Button debounce</text>
  <text x="325" y="868" text-anchor="middle" font-size="9" fill="#475569">250 ms</text>
  <text x="475" y="868" text-anchor="middle" font-size="9" fill="#475569">main.c:393</text>
  <text x="575" y="868" font-size="9" fill="#64748b">Excessive — should be 20-50 ms</text>

  <!-- Doc info -->
  <text x="1050" y="890" text-anchor="end" font-size="9" fill="#94a3b8">Rev 1.0</text>
</svg>